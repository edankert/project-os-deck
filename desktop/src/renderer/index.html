<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Note HTML comes from the sidecar and is injected into the reader, in a
      page that holds the preload bridge. A <script> would not run from
      innerHTML, but an onerror= attribute would, so the policy says where
      code and connections may come from: this origin, and nowhere else.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Deck</title>
    <link rel="stylesheet" href="./deck.css" />
  </head>
  <body>
    <header class="bar">
      <div class="brand">Deck</div>
      <nav class="switcher" id="switcher" role="tablist" aria-label="Views"></nav>
      <!-- Which surface draws the view. A toggle beside the views, never a view called Glass (TASK-0033). -->
      <div class="surface-toggle" id="surface-toggle" role="radiogroup" aria-label="Surface"></div>
      <div class="bar-right">
        <span class="host-mark" id="host-mark" title="which host is serving this page"></span>
        <!-- On a served page only: show the note the Mac's shell has focused (TASK-0057). -->
        <button type="button" class="action" id="follow" hidden aria-pressed="false" title="Show the note the Mac is showing">Follow the Mac</button>
        <!-- Every held note out of sight in this window, still held (FEAT-0015). H does the same. -->
        <button type="button" class="action" id="hide-notes" hidden aria-pressed="false" title="Hide every held note in this window, or show them again (H)">Hide notes</button>
        <button type="button" class="action" id="copy-address" title="Copy this state's address">Copy address</button>
        <button type="button" class="action" id="open-address" title="Open a pasted address">Open address…</button>
        <button type="button" class="action" id="pop-out" title="Open one panel in its own window" hidden>Pop out…</button>
      </div>
    </header>

    <div class="body">
      <aside class="rail" id="rail" aria-label="Workspaces"></aside>

      <section class="navigator" id="navigator" aria-label="Notes in this view">
        <div class="nav-bar">
          <input type="search" id="search" placeholder="search this view" aria-label="Search this view" />
          <div class="nav-filters">
            <select id="status-filter" aria-label="Filter by status"></select>
            <select id="type-filter" aria-label="Filter by type"></select>
            <span id="nav-count" class="count"></span>
          </div>
        </div>
        <!-- What this view could not be read as. Above the list, never instead of it:
             an empty view and a broken view look identical on screen. -->
        <div class="refusals" id="refusals" hidden></div>
        <!-- Waiting, failed and empty are three different things, and each is said (DES-0003). -->
        <div class="nav-state" id="nav-state" role="status" hidden></div>
        <div class="nav-list" id="nav-list" role="list"></div>
      </section>

      <main class="desk-area" id="desk-area">
        <div class="desk-bar">
          <span id="desk-name" class="desk-name">the desk is empty</span>
          <button type="button" class="action" id="save-desk">Save desk…</button>
          <select id="desk-list" aria-label="Saved desks"></select>
          <button type="button" class="action" id="clear-desk" title="Take every card off the desk">Clear</button>
          <span class="spacer"></span>
          <span id="count" class="count"></span>
          <span id="also-held" class="also-held"></span>
        </div>
        <div class="desk" id="desk" aria-live="polite"></div>
      </main>

      <!-- Glass: the field where depth carries priority (FEAT-0009). The containers
           are pointer-transparent and the cards are not (TASK-0031). -->
      <main class="field-area" id="field-area" hidden>
        <div class="field-bar">
          <!-- First, so it keeps its place whatever the label beside it says (TASK-0036). -->
          <span class="owed-count" id="owed-count" title="Every owed note in this view, drawn or not. It keeps this place whatever the front band means."></span>
          <span class="front-label" id="front-label">in front: what needs you</span>
          <span class="hand-count" id="hand-count"></span>
          <button type="button" class="action" id="let-go" hidden title="Every pulled and pushed note goes back where the record puts it">Let go</button>
          <span class="spacer"></span>
          <button type="button" class="action pending-chip" id="pending-chip" hidden></button>
          <!-- The orbit's three treatments, all drawn, switchable; which one stays is Edwin's call (TASK-0005). -->
          <div class="treatments" id="treatments" hidden role="group" aria-label="Treatment"></div>
          <span class="field-overflow" id="field-overflow"></span>
          <!-- Arrangements of the desk (FEAT-0022). Each is shown before it is applied, and can be put back. -->
          <div class="arrange" id="arrange" role="group" aria-label="Arrange the desk" hidden>
            <button type="button" class="action" id="arrange-read">Read</button>
            <button type="button" class="action" id="arrange-compare">Compare</button>
            <button type="button" class="action" id="arrange-related">Show related</button>
            <button type="button" class="action" id="arrange-undo" hidden>Undo arrangement</button>
          </div>
          <!-- The two things Escape does, by name (DES-0003): leave the focus, and close every note. -->
          <button type="button" class="action" id="leave-focus" hidden title="Put the gathered cards back where they stand in the field, and keep every note open (Escape)">put cards back</button>
          <button type="button" class="action" id="sweep-desk" hidden title="Close every note on this view's desk; a note kept on every view stays (Escape, with no focus)">close all</button>
          <span class="glass-desk-count count" id="glass-desk-count"></span>
          <span class="also-held" id="glass-also-held"></span>
        </div>
        <div class="field" id="field" tabindex="0" aria-label="The field: arrow keys turn, Home faces the front, End faces the quiet band, Escape sweeps the desk">
          <canvas class="field-canvas" id="field-canvas" aria-hidden="true"></canvas>
          <div class="field-sectors" id="field-sectors" aria-hidden="true"></div>
          <div class="field-cards" id="field-cards" role="list" aria-label="Cards in the field"></div>
          <!-- ONE tab stop for the whole quiet band (TASK-0076). The band is
               painted on the canvas, so it has no elements of its own; a
               thousand tab stops would not be a keyboard route and no tab stop
               at all is as bad by keyboard as by mouse. Arrow keys walk the
               shelf, Enter lifts, Escape leaves. -->
          <button type="button" class="quiet-cursor" id="quiet-cursor" hidden></button>
          <!-- The collection: this view's derived list as an object on the desk (FEAT-0020).
               In Glass the navigator above is moved into its body; it has no rows of its own. -->
          <section class="collection" id="collection" hidden>
            <header class="collection-head" id="collection-head" tabindex="0" role="toolbar">
              <span class="collection-name" id="collection-name"></span>
              <span class="collection-count" id="collection-count"></span>
              <span class="collection-filter" id="collection-filter" hidden></span>
              <span class="collection-tools" id="collection-tools">
                <!-- The same members three ways (FEAT-0022): the list, cards on the desk, or the header alone. -->
                <button type="button" id="collection-as-table" aria-pressed="true" title="Show these notes as the list">table</button>
                <button type="button" id="collection-as-cards" aria-pressed="false" title="Show these notes as cards">cards</button>
                <button type="button" class="collection-fold" id="collection-fold" aria-expanded="true">▾</button>
              </span>
            </header>
            <div class="collection-note" id="collection-note" role="status" hidden></div>
            <div class="collection-body" id="collection-body">
              <!-- Where the members stand as cards. The cards are the field's own, moved here; what is drawn
                   in this element is only a reference to a member that is open or gathered elsewhere. -->
              <div class="collection-grid" id="collection-grid" tabindex="0" role="group" hidden></div>
            </div>
            <p class="collection-places" id="collection-places" hidden></p>
            <span class="collection-resize" id="collection-resize" aria-hidden="true"></span>
          </section>
          <div class="field-panes" id="field-panes" aria-label="What you are holding"></div>
          <!-- An arrangement before it is applied: an outline where each object will stand, and what will
               move, in words. Nothing on the desk has moved while this is shown (FEAT-0022). -->
          <div class="arrange-preview" id="arrange-preview" hidden>
            <div class="arrange-outlines" id="arrange-outlines" aria-hidden="true"></div>
            <div class="arrange-bar" id="arrange-bar" role="dialog" aria-labelledby="arrange-title" aria-describedby="arrange-text">
              <strong id="arrange-title"></strong>
              <span id="arrange-text"></span>
              <ul id="arrange-notes"></ul>
              <span class="arrange-buttons">
                <button type="button" class="action" id="arrange-apply">Apply</button>
                <button type="button" class="action" id="arrange-cancel">Cancel</button>
              </span>
            </div>
          </div>
          <!-- The lines from the focused document to the cards gathered round it (FEAT-0017).
               The cards themselves are the field's own, moved; nothing here draws a note. -->
          <div class="field-lines" id="field-lines" hidden></div>
          <!-- One counter per edge, for related notes that stand beyond it (TASK-0104). -->
          <div class="desk-beyond" id="desk-beyond"></div>
          <div class="compass" id="compass">
            <div class="compass-dial" aria-hidden="true"><span class="compass-mark"></span></div>
            <div class="compass-text">
              <span id="compass-heading">facing the front</span>
              <span id="compass-behind"></span>
            </div>
            <!-- The zoom, shown when it is not 1× (FEAT-0016). The wheel, +, - and 0 change it. -->
            <!-- Shown while the open note is turned away from or moved aside: brings the desk back (TASK-0104). -->
            <button type="button" class="action find-open" id="find-open" hidden title="Bring the desk back in front of you"></button>
            <!-- Shown while the collection is turned away from, moved aside or behind a document (FEAT-0020). -->
            <button type="button" class="action to-collection" id="to-collection" hidden title="Bring the collection back in front of you">collection</button>
            <button type="button" class="action zoom-reading" id="zoom-reading" hidden title="Back to 1× (0)">1.0×</button>
            <button type="button" class="action" id="look-ahead" title="Face the front band (Home)">look ahead</button>
            <button type="button" class="action" id="look-behind" title="Face the quiet band (End)">look behind</button>
          </div>
          <div class="field-say" id="field-say" role="status" hidden></div>
          <!-- An empty front band is a statement, so it is said rather than left as a gap. -->
          <p class="field-empty" id="field-empty" hidden>Nothing in this view is owed right now. The view's own notes stand either side of you, and finished work is behind you.</p>
          <!-- In a narrow field one object is in front at a time; this is the way between them (DES-0003). -->
          <div class="narrow-bar" id="narrow-bar" hidden role="toolbar" aria-label="Collection and open notes"></div>
          <div class="target-strip" id="target-strip" hidden aria-live="polite"></div>
          <div class="edge-callout" id="edge-callout" hidden role="tooltip"></div>
        </div>
      </main>

      <!-- The verbs the sidecar says this note allows, and nothing Deck decided.
           ABSENT on a served page rather than disabled (ADR-0003). -->
      <div class="actuators" id="actuators" hidden></div>
      <section class="reader" id="reader" aria-label="Reader">
        <div class="reader-empty">Click a note in the list to put it on the desk and read it here.</div>
      </section>
    </div>

    <!-- A change arrived under this window. Announced, never applied: a page
         that re-arranges itself while somebody is reading it loses their place. -->
    <div class="stale" id="stale" hidden></div>
    <div class="status" id="status" role="status"></div>
    <button type="button" class="actor" id="actor" hidden title="The name Deck writes with"></button>
    <script type="module" src="./renderer/renderer.js"></script>
  </body>
</html>
