<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Note HTML comes from the sidecar and is injected into the ticket screen,
      in a page that holds the preload bridge. A <script> would not run from
      innerHTML, but an onerror= attribute would, so the policy says where
      code and connections may come from: this origin, and nowhere else.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-47SYuv52ST9yQ76ncm8OHvWn4zem0EXrZt9l4WuC2XY='; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Deck</title>
    <link rel="stylesheet" href="./deck.css" />
    <!-- Generated at build from shared/overview-scene.ts, so the app and DES-0005's plates draw one palette. -->
    <link rel="stylesheet" href="./overview.css" />
  </head>
  <body>
    <header class="bar">
      <!-- The name is the way home: the current workspace's wheel of phases (PHASE-0005). -->
      <button type="button" class="brand overview-toggle" id="overview-toggle" title="The overview: every phase as a wheel">Deck</button>
      <!-- Back and forward through the overview's screens (TASK-0146). -->
      <span class="ov-history" id="ov-history" hidden>
        <button type="button" id="ov-back" title="Back (⌘[)" aria-label="Back to the previous overview screen" disabled>←</button>
        <button type="button" id="ov-forward" title="Forward (⌘])" aria-label="Forward to the next overview screen" disabled>→</button>
      </span>
      <div class="bar-right">
        <span class="host-mark" id="host-mark" title="which host is serving this page"></span>
        <button type="button" class="action" id="copy-address" title="Copy this screen's address">Copy address</button>
        <button type="button" class="action" id="open-address" title="Open a pasted address">Open address…</button>
      </div>
    </header>

    <div class="body">
      <aside class="rail" id="rail" aria-label="Workspaces"></aside>
      <!-- The overview (PHASE-0005): its screens drawn as pictures. Since 2026-10-23 it is all Deck shows (ADR-0010). -->
      <section class="overview-area" id="overview-area" aria-label="Overview" hidden></section>
    </div>

    <div class="status" id="status" role="status"></div>
    <button type="button" class="actor" id="actor" hidden title="The name Deck writes with"></button>
    <!-- three.js draws the overview's towers (TASK-0167). It is copied into Deck's own build at
         vendor/, so nothing is loaded from elsewhere; this map names it, and the policy above
         allows exactly this map by its hash. scripts/copy-assets.mjs refuses a build where the
         two disagree. -->
    <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
    <script type="module" src="./renderer/renderer.js"></script>
  </body>
</html>
