<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DES-0005 Overview Screens</title>
<style>
:root { color-scheme: dark; }
body { margin: 0; background: #02040a; color: hsl(195 60% 88%); font: 15px/1.5 -apple-system, "Helvetica Neue", Arial, sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid hsla(190,90%,65%,.25); }
h1 { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; margin: 0 12px 0 0; }
.seg { display: inline-flex; border: 1px solid hsla(190,90%,65%,.5); border-radius: 999px; overflow: hidden; }
.seg button { background: transparent; color: inherit; border: 0; padding: 6px 12px; font: inherit; cursor: pointer; }
.seg button[aria-pressed="true"] { background: hsla(190,90%,55%,.22); }
main { padding: 12px 16px 24px; }
object { width: 100%; aspect-ratio: 1440 / 1000; display: block; border-radius: 10px; }
p.note { color: hsl(205 25% 62%); max-width: 80ch; }
</style></head>
<body>
<header><h1>DES-0005 · the overview</h1>
<div class="seg" id="ws"><button data-ws="deck" aria-pressed="true">Deck</button><button data-ws="your-trainer" aria-pressed="false">your-trainer</button></div>
<div class="seg" id="screen"><button data-screen="wheel" aria-pressed="true">S1 Wheel</button><button data-screen="phase" aria-pressed="false">S2 Phase</button><button data-screen="ticket" aria-pressed="false">S3 Ticket</button><button data-screen="rephase" aria-pressed="false">S4 Re-phase</button><button data-screen="design" aria-pressed="false">S5 Design acceptance</button><button data-screen="test-run" aria-pressed="false">S6 Acceptance test</button><button data-screen="accept" aria-pressed="false">S7 Ticket acceptance</button></div>
</header>
<main><object id="plate" type="image/svg+xml" data="__attachments__/DES-0005/wheel-deck.svg"></object>
<p class="note" id="caption"></p>
<p class="note">Point at any mark to read what it is; press a sector, a ticket or a gate to open its screen. Every screen is drawn by the same functions Deck uses, from tickets measured on Deck and on your-trainer. Generated by desktop/scripts/overview-plates.mjs; do not edit by hand.</p></main>
<script>
const plates = [{"key":"wheel","title":"S1 Wheel","ws":"deck","label":"Deck","svg":"wheel-deck.svg","png":"wheel-deck.jpg","words":11,"marks":361,"rows":366,"address":"deck://abcd1234/features?page=wheel"},{"key":"phase","title":"S2 Phase","ws":"deck","label":"Deck","svg":"phase-deck.svg","png":"phase-deck.jpg","words":10,"marks":172,"rows":191,"address":"deck://abcd1234/features?note=PHASE-0002&page=phase"},{"key":"ticket","title":"S3 Ticket","ws":"deck","label":"Deck","svg":"ticket-deck.svg","png":"ticket-deck.jpg","words":12,"marks":20,"rows":23,"address":"deck://abcd1234/features?note=FEAT-0024&page=ticket"},{"key":"rephase","title":"S4 Re-phase","ws":"deck","label":"Deck","svg":"rephase-deck.svg","png":"rephase-deck.jpg","words":5,"marks":1,"rows":8,"address":"deck://abcd1234/features?page=rephase"},{"key":"design","title":"S5 Design acceptance","ws":"deck","label":"Deck","svg":"design-deck.svg","png":"design-deck.jpg","words":9,"marks":1,"rows":14,"address":"deck://abcd1234/features?note=DES-0004&flow=design"},{"key":"test-run","title":"S6 Acceptance test","ws":"deck","label":"Deck","svg":"test-run-deck.svg","png":"test-run-deck.jpg","words":8,"marks":0,"rows":2,"address":"deck://abcd1234/features?flow=test-run&step=desktop"},{"key":"accept","title":"S7 Ticket acceptance","ws":"deck","label":"Deck","svg":"accept-deck.svg","png":"accept-deck.jpg","words":26,"marks":1,"rows":9,"address":"deck://abcd1234/features?note=FEAT-0024&flow=accept"},{"key":"wheel","title":"S1 Wheel","ws":"your-trainer","label":"your-trainer","svg":"wheel-your-trainer.svg","png":"wheel-your-trainer.jpg","words":37,"marks":2747,"rows":2774,"address":"deck://abcd1234/features?page=wheel"},{"key":"phase","title":"S2 Phase","ws":"your-trainer","label":"your-trainer","svg":"phase-your-trainer.svg","png":"phase-your-trainer.jpg","words":11,"marks":172,"rows":183,"address":"deck://abcd1234/features?note=PHASE-021&page=phase"},{"key":"ticket","title":"S3 Ticket","ws":"your-trainer","label":"your-trainer","svg":"ticket-your-trainer.svg","png":"ticket-your-trainer.jpg","words":11,"marks":14,"rows":17,"address":"deck://abcd1234/features?note=TST-0656&page=ticket"},{"key":"rephase","title":"S4 Re-phase","ws":"your-trainer","label":"your-trainer","svg":"rephase-your-trainer.svg","png":"rephase-your-trainer.jpg","words":28,"marks":987,"rows":1037,"address":"deck://abcd1234/features?page=rephase"},{"key":"design","title":"S5 Design acceptance","ws":"your-trainer","label":"your-trainer","svg":"design-your-trainer.svg","png":"design-your-trainer.jpg","words":9,"marks":1,"rows":13,"address":"deck://abcd1234/features?note=DES-0006&flow=design"},{"key":"test-run","title":"S6 Acceptance test","ws":"your-trainer","label":"your-trainer","svg":"test-run-your-trainer.svg","png":"test-run-your-trainer.jpg","words":35,"marks":1388,"rows":1460,"address":"deck://abcd1234/features?note=REL-0017&flow=test-run&step=android.4"},{"key":"accept","title":"S7 Ticket acceptance","ws":"your-trainer","label":"your-trainer","svg":"accept-your-trainer.svg","png":"accept-your-trainer.jpg","words":26,"marks":1,"rows":9,"address":"deck://abcd1234/features?note=FEAT-0130&flow=accept"}];
let ws = 'deck', screen = 'wheel';
function show() {
  const p = plates.find((x) => x.ws === ws && x.key === screen) || plates.find((x) => x.ws === ws);
  document.getElementById('plate').data = '__attachments__/DES-0005/' + p.svg;
  document.getElementById('caption').textContent = p.title + ' on ' + p.label + ': ' + p.words + ' words at rest, ' + p.marks + ' ticket marks, ' + p.rows + ' rows in the list twin. Address: ' + p.address;
  for (const b of document.querySelectorAll('#ws button')) b.setAttribute('aria-pressed', String(b.dataset.ws === ws));
  for (const b of document.querySelectorAll('#screen button')) b.setAttribute('aria-pressed', String(b.dataset.screen === screen));
}
// A click on a mark that leads somewhere opens that screen, as it does in Deck. This needs
// the plate's document, which a browser gives only when the page is served (the cockpit's
// viewer serves it); opened from a file, the switches above still reach every screen.
const SCREEN_OF = { wheel: 'wheel', phase: 'phase', ticket: 'ticket', rephase: 'rephase', design: 'design', 'test-run': 'test-run', accept: 'accept' };
document.getElementById('plate').addEventListener('load', () => {
  let doc = null;
  try { doc = document.getElementById('plate').contentDocument; } catch (e) { doc = null; }
  if (!doc) return;
  doc.addEventListener('click', (e) => {
    const el = e.target.closest && e.target.closest('[data-target]');
    if (!el) return;
    const q = new URLSearchParams(el.getAttribute('data-target').split('?')[1] || '');
    const next = SCREEN_OF[q.get('page') || q.get('flow') || ''];
    if (next && plates.some((p) => p.ws === ws && p.key === next)) { screen = next; show(); }
  });
});
document.getElementById('ws').addEventListener('click', (e) => { if (e.target.dataset.ws) { ws = e.target.dataset.ws; show(); } });
document.getElementById('screen').addEventListener('click', (e) => { if (e.target.dataset.screen) { screen = e.target.dataset.screen; show(); } });
show();
</script></body></html>
