<svg xmlns="http://www.w3.org/2000/svg" class="ov ov-test-run" viewBox="0 0 1440 1000" width="1440" height="1000" role="img" aria-label="Release test" data-address="deck://abcd1234/features?flow=test-run&amp;step=desktop"><style>
.ov { font-family: "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif; }
.ov text { fill: hsl(195 60% 88%); }
.ov text.ov-dim { fill: hsl(205 25% 58%); }
.ov .ov-id { font-family: "SF Mono", Menlo, monospace; letter-spacing: 0.04em; }
.ov .ov-num { font-family: "SF Mono", Menlo, monospace; font-weight: 600; }
.ov .ov-title { font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.ov .st-closed { fill: hsl(160 62% 46%); }
.ov .st-progress { fill: hsl(205 92% 62%); }
.ov .st-failed { fill: hsl(355 88% 62%); }
.ov .st-owed { fill: hsl(275 78% 70%); }
.ov .st-open { fill: hsl(38 96% 58%); }
.ov .st-dropped { fill: hsl(220 12% 32%); }
.ov .ty-feature { color: hsl(210 50% 65%); }
.ov .ty-task { color: hsl(140 35% 60%); }
.ov .ty-requirement { color: hsl(270 35% 68%); }
.ov .ty-issue { color: hsl(5 50% 65%); }
.ov .ty-risk { color: hsl(25 50% 60%); }
.ov .ty-adr { color: hsl(190 40% 60%); }
.ov .ty-test { color: hsl(100 35% 58%); }
.ov .ty-design { color: hsl(205 20% 68%); }
.ov .fl-delivered { fill: currentColor; stroke: currentColor; stroke-width: 0.6; }
.ov .fl-open { fill: currentColor; fill-opacity: 0.1; stroke: currentColor; stroke-width: 1.3; }
.ov .fl-unproven { fill: currentColor; fill-opacity: 0.42; stroke: currentColor; stroke-width: 1.3; }
.ov .fl-doing { fill: currentColor; fill-opacity: 0.42; stroke: currentColor; stroke-width: 1.3; }
.ov .fl-dropped { fill: currentColor; fill-opacity: 0.22; stroke: currentColor; stroke-width: 1; stroke-dasharray: 4 3; }
.ov .fl-deferred { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-dasharray: 2 3; }
.ov .ov-needs { stroke: hsl(5 50% 65%); stroke-width: 2.2; stroke-opacity: 1; stroke-dasharray: none; }
.ov .sq { fill: none; stroke: currentColor; }
.ov .sq.sq-solid { fill: currentColor; }
.ov .sq-cut { fill: none; stroke: hsl(214 55% 7%); }
.ov .sq-strike { stroke: currentColor; }
.ov .sq-dot { fill: hsl(5 50% 65%); stroke: hsl(214 55% 7%); }
.ov .ov-badge { fill: hsl(5 50% 65%); }
@keyframes ov-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
@media (prefers-reduced-motion: no-preference) { .ov .ov-doing, .ov .fl-doing { animation: ov-blink 1.6s ease-in-out infinite; } }
.ov .sq-ring { fill: none; stroke: currentColor; display: none; }
@media (prefers-reduced-motion: reduce) { .ov .fl-doing { stroke-width: 2.6; } .ov .sq-ring { display: inline; } }

.ov-panels { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
.ov-panel { position: absolute; pointer-events: auto; box-sizing: border-box; font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; color: hsl(195 60% 90%); }
.ov-panel-rows.is-tilted { perspective: 1500px; perspective-origin: 50% 0%; }
.ov-plane { height: 100%; box-sizing: border-box; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding: 18px 20px;
  background: linear-gradient(180deg, hsla(205, 60%, 30%, 0.05), hsla(205, 60%, 30%, 0.16)); border: 1px solid hsla(190, 90%, 65%, 0.22); border-radius: 12px;
  scrollbar-width: thin; scrollbar-color: hsla(190, 90%, 65%, 0.3) transparent; }
.ov-panel-rows.is-tilted .ov-plane { flex-direction: column-reverse; transform: rotateX(22deg); transform-origin: 50% 100%; transition: transform 240ms ease-out;
  box-shadow: 0 30px 60px -20px hsla(190, 90%, 50%, 0.18), inset 0 -1px 0 hsla(190, 90%, 65%, 0.4); }
.ov-sec { display: flex; flex-direction: column; gap: 4px; border-radius: 8px; outline: none; }
.ov-sec:focus-visible { box-shadow: 0 0 0 1px hsla(190, 90%, 65%, 0.7); }
.ov-sec-head { all: unset; display: flex; align-items: baseline; gap: 8px; cursor: pointer; padding: 2px 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: hsl(205 25% 62%); }
.ov-sec-head:hover, .ov-sec-head:focus-visible { color: hsl(190 90% 75%); }
.ov-sec-count { font-family: "SF Mono", Menlo, monospace; font-weight: 600; color: hsl(195 60% 85%); }
.ov-sec[data-section="needs-you"] .ov-sec-title { color: hsl(5 50% 65%); }
.ov-strip { display: none; flex-wrap: wrap; gap: 3px; padding: 4px; }
.ov-sec.is-folded .ov-strip { display: flex; }
.ov-sec.is-folded .ov-rows { display: none; }
.ov-rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.ov-row { display: grid; grid-template-columns: 14px 78px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 5px 10px; border-radius: 6px; cursor: pointer;
  background: hsla(205, 60%, 40%, 0.12); border: 1px solid hsla(190, 90%, 65%, 0.1); outline: none; }
.ov-sec[data-section="needs-you"] .ov-row { background: hsla(205, 60%, 40%, 0.2); border-color: hsla(5, 50%, 65%, 0.35); padding: 7px 10px; font-size: 14px; }
.ov-row:hover, .ov-row:focus { background: hsla(190, 90%, 55%, 0.18); border-color: hsla(190, 90%, 65%, 0.6); }
.ov-row-id { font: 12px "SF Mono", Menlo, monospace; color: hsl(205 25% 66%); letter-spacing: 0.02em; }
.ov-row-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov-row-status { font-size: 11px; color: hsl(205 25% 62%); }
.ov-row-note { grid-column: 3 / 5; font-size: 12px; color: hsl(5 50% 65%); margin-top: -2px; }
.ov-sq { display: inline-block; position: relative; width: 11px; height: 11px; box-sizing: border-box; border-radius: 2px; border: 1.5px solid currentColor; background: transparent; flex: none; }
.ov-sq.ov-sq-small { width: 8px; height: 8px; border-width: 1.2px; border-radius: 1.5px; }
.ov-sq[data-fill="delivered"] { background: currentColor; }
.ov-sq[data-fill="dropped"] { background: linear-gradient(to top right, currentColor calc(50% - 1px), transparent calc(50% - 1px), transparent calc(50% + 1px), currentColor calc(50% + 1px)); }
.ov-sq[data-fill="deferred"] { background: linear-gradient(to top right, transparent calc(50% - 0.9px), currentColor calc(50% - 0.9px), currentColor calc(50% + 0.9px), transparent calc(50% + 0.9px)); }
.ov-sq[data-fill="unproven"], .ov-sq[data-fill="doing"] { background: currentColor; box-shadow: inset 0 0 0 1.5px hsl(214 55% 7%); }
.ov-sq[data-attn]::after { content: ''; position: absolute; top: -3.5px; right: -3.5px; width: 5px; height: 5px; border-radius: 50%; background: hsl(5 50% 65%); border: 1px solid hsl(214 55% 7%); }
@media (prefers-reduced-motion: no-preference) { .ov-sq[data-fill="doing"] { animation: ov-blink 1.6s ease-in-out infinite; } }
@media (prefers-reduced-motion: reduce) { .ov-sq[data-fill="doing"] { outline: 1.5px solid currentColor; outline-offset: 1.5px; } .ov-panel-rows.is-tilted .ov-plane { transition: none; } }
.ov-panel-note { overflow-y: auto; padding: 20px 26px; background: hsla(210, 50%, 9%, 0.82); border: 1px solid hsla(190, 90%, 65%, 0.25); border-radius: 12px;
  scrollbar-width: thin; scrollbar-color: hsla(190, 90%, 65%, 0.3) transparent; }
.ov-note { font-size: 14px; line-height: 1.55; color: hsl(195 30% 88%); }
.ov-note h1 { font-size: 19px; margin: 0 0 10px; } .ov-note h2 { font-size: 15px; margin: 18px 0 6px; color: hsl(190 90% 75%); } .ov-note h3 { font-size: 14px; margin: 14px 0 4px; }
.ov-note a { color: hsl(190 90% 70%); } .ov-note code { font: 12px "SF Mono", Menlo, monospace; background: hsla(205, 60%, 40%, 0.2); padding: 1px 4px; border-radius: 4px; }
.ov-note table { border-collapse: collapse; font-size: 12.5px; } .ov-note td, .ov-note th { border: 1px solid hsla(190, 90%, 65%, 0.2); padding: 3px 6px; }
.ov-note pre { overflow-x: auto; background: hsla(205, 60%, 20%, 0.4); padding: 8px; border-radius: 6px; }
.ov-note-wait { color: hsl(205 25% 62%); font-style: italic; }

.ov .ov-track { fill: hsla(210, 60%, 50%, 0.07); stroke: hsla(195, 80%, 60%, 0.16); stroke-width: 1; }
.ov .ov-glass { fill: hsla(205, 60%, 40%, 0.14); stroke: hsla(190, 90%, 65%, 0.5); stroke-width: 1; }
.ov .ov-faint { opacity: 0.35; }
.ov .ov-banner { fill: hsla(5, 50%, 40%, 0.16); stroke: hsla(5, 50%, 65%, 0.7); stroke-width: 1; }
.ov text.ov-banner-text { fill: hsl(5 60% 82%); font-weight: 600; }
.ov .ov-links line { stroke: hsla(190, 90%, 72%, 0.55); stroke-width: 1; pointer-events: none; }
.ov .ov-row { fill: hsla(205, 60%, 40%, 0.1); stroke: hsla(190, 90%, 65%, 0.12); stroke-width: 1; }
.ov .ov-ghost { opacity: 0.12; }
.ov .ov-hit { fill: transparent; stroke: none; }
.ov .ov-hover { display: none; }
.ov .ov-wire { fill: none; stroke: hsla(190, 90%, 65%, 0.35); stroke-width: 1; }
.ov .ov-frame { stroke: hsla(190, 90%, 65%, 0.55); }
.ov .ov-bezel { stroke: hsla(190, 90%, 65%, 0.22); }
.ov .ov-scan { stroke: hsla(190, 90%, 70%, 0.35); }
.ov .ov-arc { fill: none; stroke-linecap: round; }
.ov .ov-arc.ov-track { stroke: hsla(195, 80%, 60%, 0.16); fill: none; }
.ov .ov-wire.st-closed, .ov .ov-arc.st-closed { fill: none; stroke: hsl(160 62% 46%); }
.ov .ov-wire.st-progress, .ov .ov-arc.st-progress { fill: none; stroke: hsl(205 92% 62%); }
.ov .ov-wire.st-failed, .ov .ov-arc.st-failed { fill: none; stroke: hsl(355 88% 62%); }
.ov .ov-wire.st-owed, .ov .ov-arc.st-owed { fill: none; stroke: hsl(275 78% 70%); }
.ov .ov-wire.st-open, .ov .ov-arc.st-open { fill: none; stroke: hsl(38 96% 58%); }
.ov .ov-wire.st-dropped, .ov .ov-arc.st-dropped { fill: none; stroke: hsl(220 12% 32%); }
.ov .ov-control { fill: hsla(190, 90%, 55%, 0.14); stroke: hsl(190 90% 60%); stroke-width: 1.5; }
.ov .ov-control.ov-go { fill: hsla(160, 62%, 46%, 0.22); stroke: hsl(160 62% 46%); }
.ov .ov-control.ov-stop { fill: hsla(355, 88%, 62%, 0.16); stroke: hsl(355 88% 62%); }
.ov .ov-control.ov-off { opacity: 0.3; }
.ov .glow { filter: url(#ov-glow); }
.ov [data-target], .ov [data-action] { cursor: pointer; }
.ov [data-target]:focus, .ov [data-action]:focus { outline: none; }
.ov [data-target]:focus > .ov-hit, .ov [data-action]:focus { stroke: #fff; stroke-width: 2; }
</style><defs><filter id="ov-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="ov-field" cx="50%" cy="45%" r="75%"><stop offset="0%" stop-color="#0c1a2b"/><stop offset="60%" stop-color="#060c16"/><stop offset="100%" stop-color="#02040a"/></radialGradient><pattern id="ov-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="hsla(195,80%,60%,0.05)" stroke-width="1"/></pattern></defs><rect width="1440" height="1000" fill="url(#ov-field)"/><rect width="1440" height="1000" fill="url(#ov-grid)"/><g data-key="back" data-target="deck://abcd1234/features?page=wheel" data-label="Back to the wheel" tabindex="0" role="button" aria-label="Back to the wheel"><circle cx="52" cy="52" r="26" class="ov-hit" data-label="Back to the wheel"><title>Back to the wheel</title></circle><path d="M53.2 32.04A20 20 0 0 1 68.69 40.98L59.51 47.04A9 9 0 0 0 52.54 43.02Z" class="st-closed ov-faint"/><path d="M69.89 43.06A20 20 0 0 1 69.89 60.94L60.05 56.02A9 9 0 0 0 60.05 47.98Z" class="st-progress ov-faint"/><path d="M68.69 63.02A20 20 0 0 1 53.2 71.96L52.54 60.98A9 9 0 0 0 59.51 56.96Z" class="st-open ov-faint"/><path d="M50.8 71.96A20 20 0 0 1 35.31 63.02L44.49 56.96A9 9 0 0 0 51.46 60.98Z" class="st-owed ov-faint"/><path d="M34.11 60.94A20 20 0 0 1 34.11 43.06L43.95 47.98A9 9 0 0 0 43.95 56.02Z" class="st-closed ov-faint"/><path d="M35.31 40.98A20 20 0 0 1 50.8 32.04L51.46 43.02A9 9 0 0 0 44.49 47.04Z" class="st-open ov-faint"/><circle cx="52" cy="52" r="25" class="ov-glass"/></g><text x="100" y="70" font-size="22" text-anchor="start" class="ov-title" data-role="name">Release test</text><circle cx="720" cy="500" r="340" class="ov-arc ov-track" data-target="deck://abcd1234/features?flow=test-run&amp;step=desktop" data-label="desktop" tabindex="0" role="button" aria-label="desktop"><title>desktop</title>