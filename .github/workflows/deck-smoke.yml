# Run the checks that need a real Electron window.
#
# Project-owned, deliberately beside the template's `validate-docs.yml` rather
# than inside it: that file is template-owned (`tools/sync/MANIFEST.yaml`) and
# a change to it belongs upstream in `../project-os`, where it would be run by
# every project the template serves — most of which have no Electron.
#
# **This is the only gate these checks have.** `run-smoke.sh` is not a
# `TST-*` note's `command:` any more, so `run-tests.py` does not run it —
# the smoke needs Electron, a screen AND a sidecar, and the template-owned
# `validate-docs.yml` can provide none of them (ISS-0054). This job installs
# all three.
#
# The consequence, stated because it is easy to miss: until this workflow runs,
# four of Deck's guards rest on `last_verified:` in TST-0037 and somebody's
# memory. It has never executed — the work is unpushed (ISS-0056).
#
# `run-smoke.sh` installs nothing itself. A missing Electron binary is exit 127
# with the command to run; an earlier version ran `npm ci`, which empties
# `node_modules` before fetching and so could destroy a working checkout.
# It re-execs under `xvfb-run` when it finds no display, which is why xvfb is
# installed below rather than the script being wrapped here.

name: deck-smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install, with Electron's binary
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: The sidecar this reads through
        # Deck consumes the sidecar from a SIBLING checkout and never vendors
        # it (CLAUDE.md). `sidecar.ts` runs `python -m project_os_cockpit`, so
        # the package has to be importable, not merely present.
        #
        # A private sibling needs a token: set `COCKPIT_TOKEN` in this
        # repository's secrets if the clone fails with a 404.
        run: |
          git clone --depth 1             "https://${{ secrets.COCKPIT_TOKEN || github.token }}@github.com/${{ github.repository_owner }}/project-os-cockpit.git"             ../project-os-cockpit
          python3 -m pip install --quiet -e ../project-os-cockpit
      - name: A screen for the windows to open on
        # `run-smoke.sh` re-execs itself under `xvfb-run` when it finds no
        # display, so this job's only job is to make sure `xvfb-run` is there.
        # Installing it explicitly is what keeps this job off the one
        # assumption TST-0037 records — that the runner image already has it.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
      - name: The renderer guards, in a real window
        run: bash tools/scripts/run-smoke.sh both
