  # Pruned by retention policy (ADR-0018); the notes remain the archive.
  features:
    FEAT-0001:
      file: "docs/features/orbit-view/FEAT-0001-The-Corpus-Has-An-Inside.md"
      title: "The corpus has an inside — an orbit view of the whole link graph, flown rather than listed, in Deck"
      status: doing
      owner: user:edwin
      phase: PHASE-0002
      requirements: []
      tasks: ["TASK-0001", "TASK-0002", "TASK-0003", "TASK-0004", "TASK-0005"]
      note: "Re-planned 2026-09-07 with ADR-0002: no longer the GATE in front of Glass but the ORBIT ARRANGEMENT of FEAT-0009's field, drawn by the same renderer, where distance is connectedness. Its three measurements (one request for the whole edge list, layout drift when a note is added, frame rate at the corpus's size) are EXIT CRITERIA of PHASE-0002 written as numbers, and a failed number costs this arrangement and nothing else. TASK-0001's endpoint is a change in the COCKPIT repository (the sidecar is not changed for Deck): an issue is filed there when the task starts and Deck's half consumes it. Nothing else in the phase waits for it: FEAT-0010's neighbourhood reads /api/cockpit/context per held note. Order inside the feature: TASK-0001, TASK-0002, TASK-0005 (human-only, now decides only the orbit's look), TASK-0003 (inside FEAT-0009's renderer, after TASK-0031), TASK-0004. Deck-only (Edwin 2026-09-06)."
    FEAT-0002:
      file: "docs/features/shell/FEAT-0002-Deck-Opens-A-Workspace.md"
      title: "Deck opens a workspace: an Electron shell that finds a repository, starts the sidecar and shows its notes"
      status: done
      owner: user:edwin
      phase: PHASE-0001
      requirements: []
      tasks: ["TASK-0006", "TASK-0007", "TASK-0008", "TASK-0009"]
      note: "The application itself: the Electron shell, discovery by the SNAPSHOT.yaml marker, one sidecar per workspace and a typed read-only client. Everything else in PHASE-0001 needs a window and a sidecar to read from, so this lands first. Deliberately NOT here: the terminal, the agent instrumentation and the fleet roll-up -- main-process concerns the cockpit already carries, which no exit criterion of this phase measures; their absence is a decision, recorded in the feature's Scope."
    FEAT-0003:
      file: "docs/features/store/FEAT-0003-One-Store-In-The-Main-Process.md"
      title: "One store in the main process: every window reads the same state and watches it change"
      status: done
      owner: user:edwin
      phase: PHASE-0001
      requirements: []
      tasks: ["TASK-0010", "TASK-0011"]
      note: "State lives once, in the main process, and every window subscribes. This exists because of a measured cockpit failure: its renderer reads localStorage once at start and never listens for changes, so two cockpit windows never see each other change. The reducer is pure and tested without Electron; the transport is the thin half."
    FEAT-0004:
      file: "docs/features/windows/FEAT-0004-Windows-On-Any-Screen.md"
      title: "Windows on any screen: a panel pops out, remembers the display it was on, and never steals focus"
      status: done
      owner: user:edwin
      phase: PHASE-0001
      requirements: []
      tasks: ["TASK-0012", "TASK-0013", "TASK-0014", "TASK-0026"]
      note: "Pop-out windows, bounds remembered per window and placed by display, one focus window that owns navigation and satellites that never steal it. The cockpit's window state is app-wide and carries no display identity, so a window saved on a monitor that is later unplugged restores off-screen; Deck's placement is a pure function of saved bounds and present displays, which is what makes the second exit criterion checkable without a second monitor. BACK TO doing 2026-09-07 with TASK-0026 in backlog: a pop-out is currently THE SAME VIEW AGAIN with no navigation, which is why the phase's second exit criterion was amended DOWN on 2026-09-06; Edwin restored the criterion instead, so a popped-out window will carry ONE PANEL (the Needs-you strip, a note, or a desk) and the panel type goes into the address."
    FEAT-0005:
      file: "docs/features/spread/FEAT-0005-Spread-Cards-On-A-Desk.md"
      title: "Spread: notes as cards on a desk, and a desk you can save and come back to"
      status: done
      owner: user:edwin
      phase: PHASE-0001
      requirements: []
      tasks: ["TASK-0015", "TASK-0016", "TASK-0023", "TASK-0024", "TASK-0025", "TASK-0027", "TASK-0028"]
      note: "The phase's visible half: notes as cards, several at once, and a desk that saves an arrangement by name and reopens as it was left. Cards are drawn from a pool rather than one element per note, because adding pooling later means rewriting the renderer that assumed otherwise. A desk naming a note that is gone opens without it and says how many it dropped. BACK TO doing 2026-09-07 with FIVE new tasks, after Edwin accepted the review's finding that what is built is a FLAT GRID of identical cards and demonstrates Spread not at all: nothing can be arranged, grouped or searched, Your Trainer's Issues view draws 409 cards in one grid where the cockpit folds 309 finished ones away, and Deck's own state file held ZERO desks after a day of use because a desk saved wherever the flow layout had put the cards. TASK-0023 comes first and the other four are easier after it."
    FEAT-0006:
      file: "docs/features/addresses/FEAT-0006-Every-State-Has-An-Address.md"
      title: "Every reachable Deck state has an address, so a layout is a list of addresses and some geometry"
      status: done
      owner: user:edwin
      phase: PHASE-0001
      requirements: []
      tasks: ["TASK-0017", "TASK-0018", "TASK-0052"]
      note: "BACK TO doing 2026-09-08 with TASK-0052: four kinds of state arriving in the next three phases have no written form (a Glass surface, a page, an editor, a flow at a step), so the grammar gains surface, page, flow and step, each REFUSING an unknown value, and the closed three-item panel list becomes a REGISTRY each phase adds to -- keeping the guarantee that an address cannot name what Deck cannot draw. New work inside the feature, not a defect in what was built, so it needs a review again before it returns to done. The store also reserves a FLOW CURSOR slot that nothing writes. One grammar covering workspace, view, desk and focused note, with a formatter and a strict parser. It is what makes a layout serialisable and a window restorable. The parser REFUSES what it cannot read rather than falling back to a default: the cockpit's silent fallback for an unknown nav mode made the Tests view look broken for thirty-three hours."
    FEAT-0007:
      file: "docs/features/views/FEAT-0007-Views-Come-From-A-Provider.md"
      title: "Views come from a provider: the renderer holds no fixed set of view buttons"
      status: done
      owner: user:edwin
      phase: PHASE-0001
      requirements: []
      tasks: ["TASK-0019", "TASK-0020"]
      note: "Edwin's decision of 2026-09-06 in code: the list of views is Deck's own and the sidecar is not asked for it. A provider chosen by workspace kind returns the views; the project-os provider matches the cockpit's navigator, pinned by a fixture so that a cockpit change fails the test and earns a row in the adoption table. A grep test asserts no view name is a literal in the renderer."
    FEAT-0008:
      file: "docs/features/two-hosts/FEAT-0008-One-Renderer-Two-Hosts.md"
      title: "One renderer, two hosts: the Electron shell locally, and Deck's own read-only host for a tablet"
      status: done
      owner: user:edwin
      phase: PHASE-0001
      requirements: []
      tasks: ["TASK-0021", "TASK-0022"]
      note: "Deck's own HTTP host serves the renderer and proxies reads to the sidecar, allowing GET and HEAD and refusing everything else (ADR-0001). The Electron window loads from that host too, so the shell and the tablet run identical bytes over one origin and there is no second data path. Capability is detected through the preload bridge, so shell-only actions are ABSENT when served rather than disabled."
    FEAT-0009:
      file: "docs/features/glass-field/FEAT-0009-The-Field-Where-Depth-Carries-Priority.md"
      title: "The field where depth carries priority: Glass is the view Deck opens, and what needs you is in front"
      status: done
      owner: user:edwin
      phase: PHASE-0002
      requirements: []
      tasks: ["TASK-0029", "TASK-0030", "TASK-0031", "TASK-0032", "TASK-0033", "TASK-0034"]
      note: "THE FOCUS from 2026-09-07 (ADR-0002, Edwin: 'glass should be the main view, so let's build glass now first'). A surface over the views the provider already returns: the three bands come from the groups the sidecar already sends and the navigator already draws (Needs you = front, the view's own groups = mid, suppressed = deep, behind you). Asks nothing new of the sidecar. Rendering is the DES-0002 review's HYBRID: near bands (about 12 front, 40 mid) are real DOM cards with Spread's faces, focusable and animated; the quiet band is tiles on ONE CANVAS; fog and detail-by-distance, never blur, no backdrop-filter over the moving field. Order: TASK-0029 band function and TASK-0030 slot geometry are pure functions written first, then TASK-0031 the renderer, TASK-0032 view switch and live changes announced, TASK-0033 the surface in the address with glass the default and the navigator as the keyboard route, TASK-0034 the measurement on Your Trainer in a FOREGROUND window with the numbers in the note. If the number fails on a laptop, Spread returns to default and the phase records it."
    FEAT-0010:
      file: "docs/features/glass-desk/FEAT-0010-Lifting-A-Note.md"
      title: "Lifting a note: the desk in Glass, and the neighbourhood that takes the front band while you hold it"
      status: done
      owner: user:edwin
      phase: PHASE-0002
      requirements: []
      tasks: ["TASK-0035", "TASK-0036", "TASK-0037"]
      note: "Answers what Edwin wrote in the ledger on 2026-09-07 walking TST-0015: relationships and dependencies are what he cannot see in Deck. A click lifts a note out of the field onto THE DESK SPREAD ALREADY HAS (one desk model, two surfaces; DES-0002's desk-survives-a-workspace-switch is NOT adopted, desks are per workspace); the slot stays ghosted; closing is three non-destructive verbs and a background click does nothing. While a note is held its links and backlinks take the front band, the front plane's label says what it now means and the owed count keeps a fixed place (the review's two desk findings). With several notes down the field marks what is joined to more than one. Data is /api/cockpit/context per held note, already allow-listed by Deck's host; no whole-graph payload needed. Depends on FEAT-0009's TASK-0031 (a field to lift from) and TASK-0030 (a held note is an obstacle). The live desk in the store is keyed by workspace, not by view; if per-view live desks are wanted that is a store change for TASK-0035 to decide."
    FEAT-0011:
      file: "docs/features/index/FEAT-0011-Decks-Own-Index.md"
      title: "Deck's own index: the main process reads the workspace's Markdown itself, so a view can arrange notes the sidecar does not arrange"
      status: done
      owner: user:edwin
      phase: PHASE-0001
      requirements: []
      tasks: ["TASK-0038", "TASK-0039", "TASK-0040"]
      note: "ADDED 2026-09-08 when PHASE-0001 reopened. Edwin, answering the architecture review: 'Decks own index, the Decks application are individual applications/views'. Deck's main process walks the workspace's Markdown, parses frontmatter into a record per note, watches for changes and raises a revision. NO RECORDS ENDPOINT is asked of the cockpit -- the review's proposal to file one is WITHDRAWN by that answer. The sidecar is still the authority on obligations, render, context, stats and every write; Deck's index answers only which notes a query selects. The hazard is RISK-0004: two indexers over one corpus drift, so a FIXTURE recorded from the sidecar's own library groups pins Deck's typed counts, and every deliberate difference is a NAMED ROW with its reason -- the first being that Deck must NOT reproduce cockpit ISS-0279, which drops a note whose type: is a list."
    FEAT-0012:
      file: "docs/features/descriptions/FEAT-0012-A-View-Is-A-Description.md"
      title: "A view is a description: what a view selects, groups, bands and shows becomes a document Deck reads, in a language Deck owns"
      status: done
      owner: user:edwin
      phase: PHASE-0001
      requirements: []
      tasks: ["TASK-0041", "TASK-0042", "TASK-0043", "TASK-0044", "TASK-0045", "TASK-0046"]
      note: "THE FOCUS from 2026-09-08 (ADR-0004). A view stops being an id, a label and a sidecar mode with every other decision in code. Five sections: source (kind mode = the sidecar's groups are the arrangement, or kind query = filters/sort/groupBy over FEAT-0011's index), band (TASK-0029's table moves here), face (property names, not code), surfaces (which of list/spread/glass may draw it), verbs: registry (NEVER a restated verb list, cockpit REQ-0026). The language is DECK'S OWN, seeded with the Bases subset measured in ~/Notes so every base file already reads as a description, and carrying a VERSION and an EXTENSION NAMESPACE from version one -- Edwin 2026-09-08: the subset 'cannot represent everything ... we will need to be able to extend it probably significantly'. The three type spellings are normalised. An unsupported construct is REPORTED BY NAME, never an empty list, because an empty view and a broken view look identical. TASK-0042 lands early and changes NOTHING a person sees: seven mode-sourced descriptions pinned by the existing cockpit-navigator fixture. PHASE-0002 starts after this feature. Hazard: RISK-0003, two evaluators of one language."
    FEAT-0013:
      file: "docs/features/first-write/FEAT-0013-The-First-Write.md"
      title: "The first write: Deck ticks a criterion and makes one transition, through the shell to the loopback sidecar, and the tablet is offered no verb"
      status: done
      owner: user:edwin
      phase: PHASE-0001
      requirements: []
      tasks: ["TASK-0047", "TASK-0048", "TASK-0049", "TASK-0050", "TASK-0051"]
      note: "ADDED 2026-09-08 with ADR-0003, which REVERSES PHASE-0001's 'Deck adds no write path of its own' and ARCHITECTURE.md's 'reads and never writes'. It does NOT reverse ADR-0001: Deck's host still answers 405 to every method that is not a read. The route is renderer -> preload bridge -> main process -> LOOPBACK request to the sidecar's existing guarded endpoint; the capability set gains write, FALSE when served, so a tablet is offered no verb AT ALL -- absent, not disabled. Edwin 2026-09-08: 'the tablet does not write', a RULE with no condition, not a wait on the cockpit's REQ-0034. TWO VERBS ONLY: tick a criterion with evidence (addressed by the data-raw the sidecar stamps; mtime sent; no data-raw means no tick offered) and one transition read from GET /api/notes/actions. The actor is a STORE SETTING, because the cockpit's hard-coded user:edwin is a literal that cannot be copied. A write makes other windows stale, so the changed-under-you mark is built here -- the seam PHASE-0002 and PHASE-0004 both need. Everything else the cockpit can do stays PHASE-0004's, adopted a register row at a time. Adoption: api.write.notes moved not applicable -> not yet."
    FEAT-0014:
      file: "docs/features/glass-hands/FEAT-0014-The-Hands.md"
      title: "The hands: a person arranges the field, throws a note to another screen, and reaches for a card to see what it is joined to"
      status: done
      owner: user:edwin
      phase: PHASE-0002
      requirements: []
      tasks: ["TASK-0053", "TASK-0054", "TASK-0055", "TASK-0056", "TASK-0057"]
      note: "ADDED 2026-09-10 from REFERENCE-GLASS-PHASE-REVIEW, after Edwin said the phase 'is not just a one to one replacement skin it is considerably more, the goal is to create a real minority report style UX'. As planned, Glass let a person turn, switch view, lift and put back; every band and position was the record's opinion. Five properties of the film's surface survive without gloves and the plan had one and a half. This carries the rest: PULL and PUSH by a short drag, session state in the store shared by every window, dropped by the persister, never in the address, owed beats both and the refusal says why, the label counts hand-placed and the compass counts pushed (TASK-0053); a held note is a PANE moved, resized and stacked with DES-0002's header rule, place and size in the desk record Spread saves, a stated minimum width and a widen-to-column verb (TASK-0054); a THROW off the field's edge toward a window on another display lands in its reader or on its desk, opens a new reader window on an empty display, reaches the tablet, with a target strip, a flight and a keyboard send-to (TASK-0055); REACH by hover or press-and-hold draws wires to a card's neighbours on the canvas from TASK-0036's cached context read (TASK-0056); and the SERVED PAGE FOLLOWS THE STORE over GET /deck/state and /deck/events, both 405 to writes, so the tablet shows the Mac's desk and follows focus when asked, never steering (TASK-0057). FOUND IN CODE: host-bridge.ts keeps a fresh local state when there is no bridge, so the tablet today never sees the store. Nothing a hand does writes; git status after the walk is the check. Order: TASK-0057 first (host only), 0053 after the renderer, 0054 after the lift, 0056 after the neighbourhood, 0055 last. Not adopted, in the review's Part 5: a threshold dial, the workspace ring, a time scrub, the tablet as a controller (an ADR-0001 decision, Edwin's)."
    FEAT-0015:
      file: "docs/features/view-desks/FEAT-0015-Each-View-Keeps-Its-Own-Desk.md"
      title: "Each view keeps its own desk, a note can be kept on every view, and one button hides every held note in a window"
      status: review
      owner: user:edwin
      phase: PHASE-0002
      requirements: []
      tasks: ["TASK-0058", "TASK-0059", "TASK-0060", "TASK-0061", "TASK-0062", "TASK-0063"]
      note: "ADDED 2026-09-11 from Edwin's request: 'I need a button to hide everything (all the open items) on the desk. Also, we probably need to have different open items on different views, maybe some can be marked to be open on all views?' Three parts. HIDE NOTES is a per-window toggle, never stored or addressed, that hides held panes in Glass and desk cards in Spread without taking any note off the desk; the field reclaims the slots panes covered. A DESK PER VIEW: deskCards keeps its shape and now means the notes on EVERY view of a workspace; a new viewDesks map holds each view's own notes; the desk drawn is the every-view list followed by the view's own. A note is MARKED 'on every view' by a toggle on the pane header and the Spread card (key V). NO MIGRATION: a state file written before reads unchanged and every note already held shows as on every view, which is exactly today's behaviour. REVERSES TASK-0024's rule that a view switch leaves the desk alone and FEAT-0010's 2026-09-07 reading that one desk per view is 'honoured by the address'; RESTORES DES-0002 rev 9, where Edwin said 'each view should allow for its own selected notes'. Satellite desk panels show the desk of the view in their own address (ISS-0018's pinned view); a throw to one lands there; the tablet shows the Mac's current view's desk. Saved desks stay workspace-level; whether a saved desk should remember its view is Edwin's open question. Label is 'on every view', never 'pin', which the cockpit's navigator already uses. Order: store (0058, 0059), hide (0060), Glass and Spread (0061), other windows and tablet (0062), smoke (0063)."
    FEAT-0016:
      file: "docs/features/glass-zoom/FEAT-0016-The-Wheel-Zooms-Glass-And-The-Orbit.md"
      title: "The mouse wheel zooms Glass and the orbit toward the pointer, and three keys do the same from the keyboard"
      status: review
      owner: user:edwin
      phase: PHASE-0002
      requirements: []
      tasks: ["TASK-0064", "TASK-0065", "TASK-0066"]
      note: "ADDED 2026-09-11 from Edwin's request 'add zoom (using a mouse wheel)' on Glass and the orbit, building REFERENCE-FOCUS-ZOOM-AND-VERBS recommendation 1. The wheel and a trackpad pinch zoom toward the pointer, 0.6x to 2.5x; +, - and 0 do it from the keyboard; the compass shows the zoom when not 1x and resets it. Zoom scales the field (cards, tiles, dots, links, wires), never the panes, bars or compass; the wheel over a pane still scrolls it. Window state like the yaw: not stored, not addressed, one per arrangement. DEVIATES from the reference's 'nothing is dealt again': covered cards move out from under panes once the wheel stops, because TASK-0035 forbids a card under a pane. Shift+wheel turns. Delivers the zoom FEAT-0001's scope promised ('Fly, zoom, and land') and never built. No RISK note. Order: TASK-0064 pure transform (suite zoom, TST-0050, committed WITH the suite), TASK-0065 renderer, TASK-0066 smoke."
