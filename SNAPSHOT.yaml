      note: "ADDED 2026-09-11 from Edwin's requests about selecting in the orbit and in Glass, building REFERENCE-FOCUS-ZOOM-AND-VERBS recommendation 2. A lift grows the card into a pane where it stood (300 ms), then moves it to the middle (700 ms); the neighbours (context read) move by angle and distance to a ring of up to 16 mini notes (15 plus '+N more'), keeping their circular order, with a solid line to what it links to and a dashed line from what links to it; a mini note is a door. REVISITS DES-0002 by Edwin's request (rev 7 dropped re-arranging around an opened note: 'does not survive a second note and collapses at three'): only the note on top of the desk is in the middle, the other held notes wait as headers in a dock at the left edge, and the field dims and keeps its slots. The focus is the TOP OF THE DRAWN DESK plus a per-window switch; nothing new in the store or the address. Escape first leaves the middle, a second Escape sweeps. While a note is in the middle its neighbourhood does not take the front band; leaving deals it there and turns to face it. Amends DES-0002, FEAT-0010, TASK-0035, TASK-0036, TASK-0054, FEAT-0015, FEAT-0001, TASK-0004, PHASE-0002 exit criterion 3 and the walk TST-0024, each by an appended paragraph in a task step. The same focus in the orbit, drift stopped. Tablet unchanged. No RISK note. Open question: what 'the associated notes should show their connections' should show."
    FEAT-0018:
      file: "docs/features/glass-bands/FEAT-0018-Every-Note-Has-A-Place-And-Anything-Visible-Can-Be-Reached.md"
      title: "Every note the view holds has a place in the field, every band says what it could not place, and anything a person can see they can click, tab to and pull forward"
      status: planned
      owner: user:edwin
      phase: PHASE-0002
      requirements: []
      tasks: ["TASK-0072", "TASK-0073", "TASK-0074", "TASK-0075", "TASK-0076", "TASK-0077", "TASK-0078", "TASK-0079", "TASK-0080"]
      note: "PLANNED 2026-09-12 from six issues Edwin filed and agreed the same day: 'Fully agree, plan the full solution and on ISS-0078: do as suggested.' TWO HOLES. Active work past the mid band's 64 slots is drawn NOWHERE (dealField counts midOverflow and drops the entry), which on a 409-note view is hundreds of ACTIVE notes with no position; and the quiet band is painted on a canvas no pointer or keyboard reads, so several hundred finished notes are visible and unreachable. Decided in ADR-0005 (proposed): a FOURTH BAND, the outer field, between mid and quiet, drawn as small cards; EVERY band places what fits and states the rest, the quiet one included (a capacity, never a deletion); each band's shape DERIVED from its own population in this deal, recomputed on a view or workspace change only, adapting by SIZE AND DETAIL with depth fixed. ISS-0073 is a REGRESSION against DES-0002's own rule 'anything visible is clickable', so nothing is decided there, only carried to the canvas. NO NEW GESTURE for Edwin's 'brought up to the active front band': FEAT-0014's pull already does it and only needed something to grab. Order: pure layer first (TASK-0072 deal, TASK-0073 geometry, TASK-0074 detail thresholds), then the renderer (0075), the hit test and keyboard (0076), promotion (0077), smoke (0078), THEN THE MEASUREMENT (0079) which decides whether the free list (0080) is built at all. RESOLVES ISS-0079, ISS-0076, ISS-0078, ISS-0073 and ISS-0074 steps 1-3; ISS-0077 stays open behind the measurement. AMENDS DES-0002 (four bands; the clickable rule reaches the canvas) and FEAT-0016's out-of-scope line (semantic zoom lands here). RE-OPENS PHASE-0002's frame-time criterion. BOTH OPEN QUESTIONS ANSWERED 2026-09-12 by Edwin: the fourth band is the OUTER FIELD ('outer' in BandName -- mid and outer are a pair, and 'quiet' stays the odd name out on purpose because it names a state and not a distance), and exit criterion 1 is reworded to 'Every note the view holds is in a band or counted on screen, and no band is silently short', the sentence TST-0056 walks."
