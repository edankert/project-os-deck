    ISS-0024:
      file: "docs/issues/ISS-0024-The-Yaml-Reader-Walks-Away-From-The-Rest-Of-A-Document.md"
      title: "A key whose value is followed by an indented list makes Deck's YAML reader abandon everything after it, so twenty-two notes lose their relationship fields"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: high
      component: shared
      tests: []
      note: "Independent review, 2026-09-09. `mapping()` breaks on a `- ` line BEFORE checking whether it is over-indented, so a key whose scalar value is followed by an indented list ends the mapping and every key after it is unread. Twenty-two of Your Trainer's notes lose `effort`, `depends`, `blocks`, `related` and `tests`; PyYAML FOLDS those lines into the scalar and reads on. Not silent — `reportLeftovers` names the lines — but records.ts and TASK-0038 both claim every key is present, which is false."
    ISS-0025:
      file: "docs/issues/ISS-0025-A-Block-Scalar-Silently-Loses-Lines-And-Two-Escapes-Are-Wrong.md"
      title: "A literal block scalar silently loses every blank line and every line beginning with a hash, and two string escapes produce the wrong characters"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: high
      component: shared
      tests: []
      note: "Independent review, 2026-09-09. WORSE than ISS-0024 because it is SILENT: `scan()` strips blank and comment lines from the whole document before any reader runs, so a `|` block scalar loses every blank line, every line starting with `#`, and its trailing newline. Refutes TASK-0038's 'zero unreported problems'. Two latent siblings: `\\n` is read before `\\\\` so a literal backslash-n comes out as backslash-newline, and a nested block sequence flattens."
    ISS-0026:
      file: "docs/issues/ISS-0026-The-Sidecar-Comparison-Cannot-See-A-Note-Deck-Never-Indexed.md"
      title: "The check that Deck and the sidecar agree about every note skips any note Deck failed to index, so hiding a sixth of the corpus still passes it"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: high
