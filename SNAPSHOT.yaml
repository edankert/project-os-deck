    ISS-0021:
      file: "docs/issues/ISS-0021-A-Sidecar-Started-After-The-Quit-Began-Outlives-Deck.md"
      title: "A sidecar spawned after the quit began, or any quit that came from a signal, still left a Python process running after Deck was gone"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: medium
      component: main
      tests: ["TST-0001"]
      note: "SECOND pass at FEAT-0002's fifth criterion and at Edwin's TST-0011 doubt; the first pass held the quit open and two paths walked round it. ONE: stopAll runs once and a child spawned after it is held by nobody -- the ISS-0009 port retry spawns exactly that. TWO: the SIGNAL path called app.exit, which never raises before-quit, so it never waited; stopOne's SIGKILL escalation is an unref'd timer that cannot fire from a gone process. So kill -TERM on a terminal-launched Deck left a sidecar. THREE: nothing checked the quit CALLED the waiter -- stopAll returning [] passed all 163 checks. Fixed: the supervisor carries a never-cleared stopped flag checked before AND after the spawn; every quit path awaits waitForExit; a check asserts stopAll hands back exactly Deck's own children and that a late resolve is refused. main.ts's before-quit handler itself stays unguarded (ISS-0008)."
    ISS-0017:
      file: "docs/issues/ISS-0017-A-Restored-Card-Creeps-Down-The-Desk-On-Every-Repaint.md"
      title: "A card restored below the desk's window creeps further down on every repaint, so it walks off the bottom again while a person folds a group or types in the search box"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: medium
      component: renderer
      tests: ["TST-0019"]
      note: "A close-out review LEAD, reproduced by a check on 2026-09-07 and fixed. drawDesk clamped against deskBounds, which takes max(clientHeight, scrollHeight) -- and scrollHeight was measured BEFORE pool.render, so it described the previous paint, which for a restored card is where this same clamp last put it. 2000 -> 352 -> 408 -> 464, about 56px per repaint, and a repaint happens on every fold, keystroke and cross-window change. TWO JOBS, TWO BOUNDS: a DRAGGED card keeps deskBounds (the content already scrolls that far, ISS-0005); a RESTORED card uses the new viewportBounds, a fixed measure. The check drives the OLD bound and fails if the drift is absent, so it cannot pass by accident."
    ISS-0018:
      file: "docs/issues/ISS-0018-A-Needs-You-Panel-Follows-The-Focus-Windows-View.md"
