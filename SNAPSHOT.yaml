    ISS-0025:
      file: "docs/issues/ISS-0025-A-Block-Scalar-Silently-Loses-Lines-And-Two-Escapes-Are-Wrong.md"
      title: "A literal block scalar silently loses every blank line and every line beginning with a hash, and two string escapes produce the wrong characters"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: high
      component: shared
