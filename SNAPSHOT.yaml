  phase: "PHASE-0002"
  feature: "FEAT-0018"
  task: "TASK-0072"
  issue: ""
  note: "2026-09-12: FEAT-0018 PLANNED, nothing built. Edwin agreed the whole plan -- 'Fully agree, plan the full solution and on ISS-0078: do as suggested' -- after six issues about the Glass field. The field has two holes. Active work past the mid band's 64 slots is drawn NOWHERE (ISS-0079): dealField counts it as midOverflow and drops it, so on Your Trainer's Issues view hundreds of ACTIVE notes have no position at all. And a finished note is painted on a canvas no pointer or keyboard reads (ISS-0073), which is a REGRESSION against DES-0002's own rule 'anything visible is clickable'. ADR-0005 (proposed) decides three things together: a FOURTH BAND, the outer field, between mid and quiet, drawn as small cards; EVERY band places what fits and states the rest, the quiet band included (Edwin's 'do as suggested' on ISS-0078 -- a capacity, NEVER a deletion, the band stays drawn); and each band's shape DERIVED from its own population in this deal (ISS-0076), adapting by SIZE AND DETAIL with the depth fixed, recomputed on a view or workspace change only. ORDER, pure layer first as this repo does everywhere: TASK-0072 (the deal and the capacities, suite field, TST-0053), TASK-0073 (the derived geometry, suite slots, TST-0054), TASK-0074 (detail by apparent width, new suite detail, TST-0055; independent of the other two), then TASK-0075 (the renderer draws four bands and states four remainders), TASK-0076 (tileAt, cursor, callout, one roving tab stop), TASK-0077 (a tile large enough becomes a card), TASK-0078 (smoke, real pointer and keyboard), TASK-0079 (THE MEASUREMENT, all three workspaces, throttled and not), and only then TASK-0080 (a free list, and only if the measurement asks). Walk TST-0056. NO NEW GESTURE is built for Edwin's 'brought up to the active front band': FEAT-0014's pull already does it and was unreachable only because there was nothing to grab. RESOLVES ISS-0079, ISS-0076, ISS-0078, ISS-0073 and ISS-0074 steps 1-3 (step 4, an excerpt, stays dropped); ISS-0077 stays open behind TASK-0079's numbers, and its two corrections must survive -- a pool caps CHURN not the LIVE COUNT, and CardPool is POSITIONAL so it would break PHASE-0002's ticked exit criterion 2. BOTH QUESTIONS ANSWERED 2026-09-12 by Edwin: the fourth band is the OUTER FIELD, 'outer' in BandName, and PHASE-0002 exit criterion 1 now reads 'Every note the view holds is in a band or counted on screen, and no band is silently short'. NOTHING BLOCKS TASK-0072. PHASE-0002's frame-time criterion is re-opened by design. STILL OPEN FROM EARLIER: FEAT-0015, FEAT-0016 and FEAT-0017 are at review waiting on walks TST-0048 and TST-0052; ISS-0070, ISS-0071 and ISS-0072 revise decisions inside FEAT-0017 and are not planned yet; ISS-0075 (the smoke run steals focus) and ISS-0069 (where the verb buttons go) are unplanned; ISS-0068 is at triage."
