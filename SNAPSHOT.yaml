    ISS-0023:
      file: "docs/issues/ISS-0023-Two-Sidecars-For-One-Repository-When-The-Paths-Differ-Only-In-Case.md"
      title: "Deck starts a second sidecar for a repository the cockpit already has open when the two spell the home directory differently, and that sidecar rewrites the repository's discovery file to its own port"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: high
      component: main
      tests: []
      note: "Observed 2026-09-08 while starting Deck for the reopened TST-0011: the cockpit served your-trainer on 8766, Deck started its own on 8901 for the same directory, and .cockpit/url was rewritten to 8901 and left there dead when Deck went. Cause: alive() compares path.resolve(identity.root) with path.resolve(root) as STRINGS, and macOS is case-insensitive -- the cockpit launched with /Users/edwin/... and Deck holds /Users/Edwin/..., so the guard called one directory two. Reopens RISK-0001, whose mitigation is that comparison; both guarding checks pass because both spell their paths the same way. This repository is unaffected (both hold /Users/Edwin/Dev/repos/project-os-deck), which is why it went unseen. Two decisions: compare real paths rather than strings, and whether a stale discovery file naming a dead port belongs upstream in the cockpit."
    ISS-0022:
      file: "docs/issues/ISS-0022-The-Smoke-Run-Says-A-Popped-Out-Desk-Never-Draws-A-Card.md"
      title: "The smoke run's popped-out desk window shows no cards at all: one put on the desk from another window never appears, and the focused note is never highlighted there"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: high
      component: renderer
      tests: []
      note: "Found 2026-09-08 by running `npm run smoke` for the first time against the build of 2026-09-07; the close-out commit records that the smoke run could not be executed then. Two of its checks fail and every other one passes, as do the 165 unit tests. The satellite on deck://<ws>/features?panel=desk drew ZERO cards BEFORE the dispatch as well as after, so this is not only a change that failed to arrive. Two candidates, undiagnosed: the desk drops every card not in the pinned view because that view loaded empty in the satellite (drawDesk -> reconcileDesk over currentCards), or a satellite does not repaint on a change from another window, which is FEAT-0003's whole claim and what ISS-0018 touched last. Filed at triage so the reopened walks are not held up; the cheap diagnosis is to pop a desk out by hand and watch the count."
    ISS-0021:
      file: "docs/issues/ISS-0021-A-Sidecar-Started-After-The-Quit-Began-Outlives-Deck.md"
      title: "A sidecar spawned after the quit began, or any quit that came from a signal, still left a Python process running after Deck was gone"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: medium
      component: main
      tests: ["TST-0001"]
      note: "SECOND pass at FEAT-0002's fifth criterion and at Edwin's TST-0011 doubt; the first pass held the quit open and two paths walked round it. ONE: stopAll runs once and a child spawned after it is held by nobody -- the ISS-0009 port retry spawns exactly that. TWO: the SIGNAL path called app.exit, which never raises before-quit, so it never waited; stopOne's SIGKILL escalation is an unref'd timer that cannot fire from a gone process. So kill -TERM on a terminal-launched Deck left a sidecar. THREE: nothing checked the quit CALLED the waiter -- stopAll returning [] passed all 163 checks. Fixed: the supervisor carries a never-cleared stopped flag checked before AND after the spawn; every quit path awaits waitForExit; a check asserts stopAll hands back exactly Deck's own children and that a late resolve is refused. main.ts's before-quit handler itself stays unguarded (ISS-0008)."
    ISS-0017:
      file: "docs/issues/ISS-0017-A-Restored-Card-Creeps-Down-The-Desk-On-Every-Repaint.md"
      title: "A card restored below the desk's window creeps further down on every repaint, so it walks off the bottom again while a person folds a group or types in the search box"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: medium
      component: renderer
      tests: ["TST-0019"]
      note: "A close-out review LEAD, reproduced by a check on 2026-09-07 and fixed. drawDesk clamped against deskBounds, which takes max(clientHeight, scrollHeight) -- and scrollHeight was measured BEFORE pool.render, so it described the previous paint, which for a restored card is where this same clamp last put it. 2000 -> 352 -> 408 -> 464, about 56px per repaint, and a repaint happens on every fold, keystroke and cross-window change. TWO JOBS, TWO BOUNDS: a DRAGGED card keeps deskBounds (the content already scrolls that far, ISS-0005); a RESTORED card uses the new viewportBounds, a fixed measure. The check drives the OLD bound and fails if the drift is absent, so it cannot pass by accident."
    ISS-0018:
      file: "docs/issues/ISS-0018-A-Needs-You-Panel-Follows-The-Focus-Windows-View.md"
      title: "A popped-out Needs-you panel silently re-points at whatever view the main window last chose, thirty seconds later, which is the opposite of what a satellite promises"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: medium
      component: renderer
      tests: []
      note: "A close-out review LEAD, established by READING and fixed 2026-09-07. startNeedsYouPoll refreshes every 30s because nothing pushes from the sidecar, and it resolved its workspace and view from host.state() -- the SHARED store the focus window writes to. So the strip followed a view change with no click and no visible cause. Now read ONCE when the poll starts. UNGUARDED by anything automated (ISS-0008); the walk is TST-0020."
    ISS-0019:
      file: "docs/issues/ISS-0019-Pasting-A-Panel-Address-Collapses-The-Focus-Window.md"
      title: "Pasting an address copied from a popped-out window hides the main window's navigator and reader, and no control left on screen brings them back"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: medium
      component: renderer
      tests: []
      note: "A close-out review LEAD, established by READING and fixed 2026-09-07. A satellite's own Copy address ends ?panel=desk, because the panel is in the grammar so a restart reopens the right thing. applyAddress stamped it on ANY window, and the stylesheet then hides the navigator and the reader -- including the controls that would undo it. Recovery meant retyping the address without the panel. Now only a satellite adopts a panel from an address; the focus window follows the rest and SAYS it left the panel behind. UNGUARDED (ISS-0008)."
    ISS-0020:
      file: "docs/issues/ISS-0020-A-Promoted-Satellite-Draws-No-Navigation.md"
      title: "Closing the main window promotes a satellite that keeps drawing one panel, so Deck is left with a window it calls the focus window that has no view buttons and no workspace rail"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: medium
      component: main
      tests: []
      note: "A close-out review LEAD, established by READING and fixed 2026-09-07. FEAT-0004's sixth criterion says a new focus window adopts navigation; the first half (satellites keep rendering) held and the second did not. The promotion set info.role in a main-process map the renderer reads ONCE, in boot(), so the promoted window kept pinned=true and drew no rail and no switcher. The smoke run asserted promoted==='focus' out of that same map -- the transport, not the behaviour. Now the window is reloaded at /?role=focus: state lives in the main process and comes back, only the pinning is dropped. UNGUARDED: no suite can import main/main.js (ISS-0008)."
    ISS-0016:
      file: "docs/issues/ISS-0016-The-Acceptance-Gate-Reads-A-Field-This-Repo-Does-Not-Use.md"
      title: "The validator's acceptance gate reads a mark: field on the test note and never the release ledger, so it can never be satisfied here, and on 2026-11-20 it turns this repository red"
      status: declined
      owner: user:edwin
      phase: PHASE-0001
      severity: medium
      component: tools
      tests: []
      note: "Found by closing three features on 2026-09-07: each raised VERIFY-ACCEPTANCE naming a walk Edwin had already marked pass. validate-docs.py _acceptance_is_settled reads fm['mark'] on the TEST NOTE; this repo puts the verdict in docs/releases/ledgers/WORKING-app.json (ADR-0037) and the note rests at active with no mark. The word 'ledger' appears nowhere in the validator. The message also asks for done/incomplete/canceled, which TAXONOMY.md lists as LEGACY, never written; current is pass/partial/na/excused/blocked/question/fail. WARNING today, ERROR on 2026-11-20 per the PROMOTIONS table. Fix belongs UPSTREAM in ../project-os -- tools/scripts/ is template-owned and sync-project-os.sh overwrites a local patch."
    ISS-0011:
      file: "docs/issues/ISS-0011-A-Read-From-The-Served-Page-Kills-A-Sidecar-That-Is-Still-Indexing.md"
      title: "A read from the served page kills the sidecar Deck is still waiting for, so a tablet opening a large workspace gets an empty screen and 'the sidecar exited before it answered'"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: high
      component: main
      tests: []
      note: "The close-out review's sharpest finding, 2026-09-07, reproduced with a stub sidecar and one proxied read. ISS-0010's symptom down a path that fix does not cover. startOnce registers the record BEFORE waitForHealth on purpose (so a quit mid-wait kills the child), so sidecarBaseFor answers for the whole indexing window -- ten seconds for Your Trainer, up to forty-five. A read then gets a connection refusal, host.ts calls onSidecarUnreachable, main.ts wires that to forget(), and forget stops a sidecar Deck owns. The SHELL cannot reach it (boot awaits resolve); the SERVED PAGE can, because its openWorkspace only dispatches locally and loadView reads at once. That is the tablet configuration TST-0010 walks. HOLDS FEAT-0002 and FEAT-0008 at review."
    ISS-0012:
      file: "docs/issues/ISS-0012-A-Filter-Survives-The-View-It-Was-Set-On.md"
      title: "A filter set on one view still narrows the next one, and the dropdowns say nothing is filtered, so the navigator reads empty for no visible reason"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: medium
      component: renderer
      tests: []
      note: "Close-out review 2026-09-07, reproduced. reduce() clears query on open-workspace and never clears filters; select-view clears neither (shared/store-state.ts:97-115). renderFilters then rebuilds the select from the NEW view's values and falls back to '', so syncFilters assigns a value with no matching option and the DOM ignores it: the navigator says 0 of 30 while both dropdowns say any. store.test.mjs:33 is titled 'opening a different workspace clears what belonged to the old one' and asserts only viewId, noteId, deskName -- the title is wider than the assertions, which is why it was missed. HOLDS FEAT-0005 at review."
    ISS-0013:
      file: "docs/issues/ISS-0013-The-Remove-Control-Is-Shown-In-The-Needs-You-Strip-And-Does-Nothing.md"
      title: "The remove control still appears on a card in the Needs-you strip and now silently does nothing, which is not the behaviour ISS-0007 recorded as fixed"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: low
      component: renderer
      tests: []
      note: "Close-out review 2026-09-07, reproduced. ISS-0007 recorded 'hidden in the strip and refuses there in any case'; only the refusal was built. grep for remove in deck.css returns three rules and none hides the control, in source or in the built stylesheet, and renderer.ts:76 repeats the claim. So a person is offered an action that quietly does nothing -- a DIFFERENT wrong behaviour, not the absence of one. ISS-0007's claim is corrected in place. HOLDS FEAT-0004 at review."
    ISS-0014:
      file: "docs/issues/ISS-0014-The-Forwarding-Allow-List-Reads-The-Path-And-Never-The-Query.md"
      title: "Deck's forwarding allow-list constrains the path and never the query, so a request from the LAN can ask the sidecar to render any file and only the sidecar's own guard stops it"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: medium
      component: main
      tests: []
      note: "Close-out review 2026-09-07, reproduced against a recording fake sidecar: /api/render?path=../../../../etc/passwd is forwarded verbatim. NOT EXPLOITABLE today -- the cockpit's _serve_render refuses it twice (a '..' part check, then _is_under(docs_root)). But Deck's second lock does not cover the shape and TST-0007's Expected results claimed 'the sidecar never sees it', which is corrected. Two non-defects from the same probe: //healthz is refused 403 although it is a legitimate read, and a traversal out of an allowed path answers 503 rather than 403 because normalisation happens before the workspace id is split off. HOLDS FEAT-0008 at review."
    ISS-0015:
      file: "docs/issues/ISS-0015-Four-Smaller-Things-The-Close-Out-Review-Found.md"
      title: "Four smaller things the close-out review found: a check asserting on a message the code no longer emits, two satellites sharing one saved rectangle, a quadratic row lookup, and a count that counts a note twice"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: low
      component: renderer
      tests: []
      note: "Close-out review 2026-09-07. sidecar-retry.test.mjs:174 asserts on 'did not answer within 15s' and the timeout is 45s now. boundsKey(role, panel) gives two panel=desk windows one rectangle so they stack. paintRow recovers the index with indexOf when the caller has it. The N of M count counts a note twice when the sidecar sends it twice (consistent on both sides, just not distinct). Plus: the click handler resolves cards.get(noteId) rather than row.card, so a note in two groups opens whichever painted last. Blocks nothing; groom."
    ISS-0003:
      file: "docs/issues/ISS-0003-A-Served-Page-Cannot-Open-A-Workspace-The-Shell-Has-Not.md"
      title: "A served page cannot open a workspace the shell has not opened, and the only thing it tells you is that the sidecar answered 503"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: medium
      component: renderer
      tests: []
      note: "Found 2026-09-07 during the PHASE-0001 review. The served rail lists EVERY workspace Deck knows, but only the one the shell has opened has a sidecar behind it; the served openWorkspace in host-bridge.ts dispatches to the store and STARTS NOTHING, and host.ts answers 503 'no sidecar is running for that workspace'. What resolves a sidecar is the shell's own deck:workspaces:open handler, which a browser never reaches. A person on a tablet gets an empty desk and one 503 line, with no way to know the fix is to open that workspace on the Mac. TRIAGE DECIDES between hiding the unreachable workspaces and explaining them; either way TST-0010 gains a Setup line."
    ISS-0004:
      file: "docs/issues/ISS-0004-Two-Decks-Bind-The-Same-Port.md"
      title: "Two Decks bind the same port, because the free-port probe passes on loopback while another Deck already holds the wildcard address"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: medium
      component: main
      tests: []
      note: "Found 2026-09-07: two Deck processes were listening on 7300 at the same time, one on *:7300 (started with --lan on 2026-09-06) and one on 127.0.0.1:7300 (started without it on 2026-09-07). Which one answers a browser at 127.0.0.1:7300 is UNDETERMINED. This is the MIRROR of ISS-0002, whose fix made freePort bind the same interface as the host: that stopped a wildcard host claiming a loopback-held port, and does nothing about a loopback host claiming a wildcard-held one. Starting the same fresh Deck with --lan made the probe bind 0.0.0.0, fail, and move to 7301."
    ISS-0010:
      file: "docs/issues/ISS-0010-Two-Windows-Opening-One-Workspace-Kill-Each-Others-Sidecar.md"
      title: "Two windows opening one workspace at the same time kill each other's sidecar, so both show nothing and say the sidecar exited before it answered"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: high
      component: main
      tests: ["TST-0022"]
      note: "FIXED 2026-09-07. Deck did this to itself, and only since panels are restored at launch: two windows boot, both open the workspace their state names, and the SECOND resolve finds the first one's child registered but not yet answering, calls it a dead sidecar of ours and stops it. The first call's child then exits with NO stderr, which is why the message carries no traceback. Your Trainer takes ~10s to index 2660 notes, so the window is most of the startup."
    ISS-0009:
      file: "docs/issues/ISS-0009-A-Sidecar-Cannot-Bind-The-Port-Deck-Offered-It.md"
      title: "A sidecar Deck starts can be refused the port Deck offered it, because Deck's probe sets a socket option the sidecar's Python server does not, and the workspace then will not open"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: high
      component: main
      tests: ["TST-0022"]
      note: "Edwin hit this on 2026-09-07 restarting Deck for the panel walk: both windows empty, and the sidecar's own traceback saying Errno 48. Node sets SO_REUSEADDR on what it binds and CPython's socketserver does not, so a port whose previous listener has gone but whose socket lingers is bindable by Deck's probe and refused to the sidecar. NO probe can fix it: the question is asked in a different process at a different moment. Deck retries on the next port instead."
    ISS-0008:
      file: "docs/issues/ISS-0008-Nothing-In-CI-Exercises-The-Renderer.md"
      title: "Nothing in continuous integration exercises the renderer, so four of Spread's tasks make claims that only a run on Edwin's machine can check"
      status: triage
      owner: user:edwin
      phase: PHASE-0002
      severity: medium
      component: tests
      tests: []
      note: "The independent review's STRUCTURAL finding, 2026-09-07, and the reason three of its six defects existed. No suite loads desktop/src/renderer/; the smoke run does drive it, and the smoke run is not in CI because it needs Electron's binary. Three ways out and they are not the same size: a document stand-in (a first dependency), a headless Electron job (a 100MB download per run), or moving yet more logic into shared/ (already done for rows, search, faces and desk; the drag and the pool cannot leave). Which one is worth it is Edwin's call, which is why this rests at triage. MOVED to PHASE-0002 on 2026-09-07 when PHASE-0001 closed: a phase cannot be done while a note naming it in phase: is unresolved, and Glass is all renderer, so the gap widens there. Still triage; grooming decides, and PHASE-0004 is the other candidate."
    ISS-0005:
      file: "docs/issues/ISS-0005-A-Card-Jumps-When-The-Desk-Has-Scrolled.md"
      title: "A card jumps hundreds of pixels when it is dragged on a desk that has scrolled, because the clamp measures the window while the position measures the content"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: high
      component: renderer
      tests: ["TST-0019"]
      note: "FIXED 2026-09-07, found by the independent review. The drag built a position in the desk's CONTENT coordinates and clamped it against the WINDOW onto them, so a card on a desk scrolled down 500 pixels leapt about 500 pixels on the first movement. deskBounds takes the larger of the two. The check asserts the defect as well as the fix."
    ISS-0006:
      file: "docs/issues/ISS-0006-A-Clean-Quit-Forgets-Every-Popped-Out-Panel.md"
      title: "A clean quit forgets every popped-out panel, and only a kill preserves them, because the window's own close handler removes it from the book"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: high
      component: main
      tests: []
      note: "FIXED 2026-09-07, found by the independent review reading the two quit paths against each other. app.quit() closes every window before it leaves, and the close handler forgot each panel, so the normal quit lost them and a signal kill kept them. Same guard the geometry path already had. This is the criterion TASK-0026 exists for."
    ISS-0007:
      file: "docs/issues/ISS-0007-Four-Smaller-Defects-The-Review-Found-In-The-Renderer.md"
      title: "Four smaller defects in the renderer: an unclamped restored position, a count of two different things, a live remove control on a status card, and filters that do not follow a second window"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: medium
      component: renderer
      tests: ["TST-0019"]
      note: "FIXED 2026-09-07. Four findings that share one cause: no automated suite loads the renderer, so four of the six tasks make claims nothing checks. The unclamped restored position was claimed as done in two notes, and the check that should have caught it called the pure function directly rather than through the application."
    ISS-0002:
      file: "docs/issues/ISS-0002-A-Second-Deck-Cannot-Start-And-Says-Nothing.md"
      title: "A second Deck cannot start and says nothing — the free-port probe binds loopback while the host binds every interface, so a port another Deck already holds looks free, and the failure is an unhandled rejection with no window and no message"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: high
      component: main
      tests: ["TST-0001"]
      note: "FIXED 2026-09-06; two Decks now start side by side on 7300 and 7301. TWO faults, found 2026-09-06 while adding an npm script for the tablet walk. freePort probes by binding 127.0.0.1 and the host binds 0.0.0.0 under --lan, so a port another Deck holds on every interface reads as free and listen fails with EADDRINUSE. And app.whenReady().then(...) has no catch, so the failure skips window creation entirely: no window, no message, an application that appears to do nothing when launched. The second fault is what makes the first hard to diagnose."
    ISS-0001:
      file: "docs/issues/ISS-0001-Cards-From-The-Previous-View-Stay-On-Screen.md"
      title: "Cards from the previous view stay on screen — the pool hides a spare card with the `hidden` attribute, and the stylesheet's own `display: flex` overrides it, so switching to a shorter view repaints its cards over the top of the old ones"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: high
      component: renderer
      tests: ["TST-0014"]
      note: "FIXED 2026-09-06 with one stylesheet rule: [hidden] { display: none !important; }. Found by Edwin walking TST-0008, and his counts are the diagnosis: switching from Features (30 cards) to Tests (13) repaints 13 and leaves 17 of the old view on screen; Issues, Publication and Library have 0 and change nothing. CAUSE: the pool hides a spare card with element.hidden, and .card { display: flex } in Deck's own stylesheet beats the browser rule for hidden elements, so the mark is set and the card stays visible. NOTHING IN THE RENDERER IS WRONG -- the pool's arithmetic is right, only the paint is. No test caught it because none of the seven suites renders anything, and the smoke run counted `.card:not([hidden])`, which returns the right number while the wrong number is on screen."
