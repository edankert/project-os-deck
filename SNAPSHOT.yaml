      note: "Third review, 2026-09-09, finding 1. renderer.ts:689 is article.innerHTML = note.html, and Python-Markdown passes raw HTML through, so the CSP meta tag in index.html is the only thing stopping a note running script in the window that holds window.deck.write.*. Deleting it leaves 316 checks passing and the smoke run ok:true. FEAT-0008's first pass named it on 2026-09-07 when the window could only read; the write path landed the next day and nothing revisited it. Assert it by driving a real window, not by grepping the file."
    ISS-0039:
      file: "docs/issues/ISS-0039-Deck-Draws-Two-Verbs-On-A-Design-Note-That-It-Cannot-Perform.md"
      title: "Deck draws Accept and Decline on every proposed design and both are dead, because it ignores the field saying that verb posts somewhere else"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: high
      component: renderer
      tests: []
      note: "Third review, 2026-09-09, finding 2. applyVerb ignores ActuatorRow.endpoint, the field write-client.ts documents as the path a verb posts to when it is not the generic transition. DES-0001 and DES-0002 are proposed here today and their rows carry /api/design/verdict; posting as a transition is refused. Both the suite check and check-write-round-trip.mjs compare rows on ISS-0008, whose endpoint is empty, so drawing the row right and acting on it wrong is invisible. Deck cannot post the verdict — it needs the revision judged and Deck has no revision history — so the fix is to draw the row unavailable and say where the decision is recorded."
    ISS-0040:
      file: "docs/issues/ISS-0040-The-Reason-Is-Asked-For-Only-On-A-Verb-That-Confirms.md"
      title: "Deck asks why only for a verb that stops to confirm, so accepting an issue still records no reason, and the check that proved the fix drives the verb the interface never asks about"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
