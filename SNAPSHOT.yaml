      note: "Re-review, 2026-09-09. THREE ways of dropping the pathPrefix each leave all 307 checks passing — pathPrefixFor, the host answer, and readRecords — and each restores exactly the ISS-0027 defect silently. The one check that touches it hands the value to runQuery as a literal, so it proves the evaluator USES a prefix and never that one ARRIVES. A test per hop would rot; the shape to reach for is one where dropping it is a type error."
    ISS-0032:
