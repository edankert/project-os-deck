  issues:
    ISS-0079:
      file: "docs/issues/ISS-0079-Active-Work-Past-The-Mid-Bands-Capacity-Is-Drawn-Nowhere.md"
      title: "A note the view's own rule puts in the mid band, past that band's sixty-four slots, is drawn in no band at all — not even behind the person — so on a large view most of the active work is missing from the field and only a count says so"
      status: open
      owner: user:edwin
      phase: PHASE-0002
      severity: high
      component: renderer
      tests: []
      note: "Filed 2026-09-12 from Edwin: 'Maybe we need more bands and allow cards to be brought up to the active front band????'. THE FIELD'S REAL HOLE. Front holds 20 slots, mid 64; dealField increments midOverflow and DROPS the entry, with no path from a full mid band to anywhere — the front band has spare slots for a pull, the mid band has none. On Your Trainer's Issues view (409 notes) that is hundreds of ACTIVE notes with no position in a field whose claim is that depth carries priority, while finished work at least has a place. DES-0002's own review said it on 2026-09-05 ('past 40 mid slots a subject note falls into the quiet, which then means both finished and did not fit. Both need a stated rule'); Deck answered half — the bar states both counts — and left the note placeless. Three ways: a FOURTH BAND for the remainder (recommended, and it needs ISS-0076's derived geometry because four hand-written sets of constants is worse than three), overflow into the quiet band (what the prototype did; conflates finished with did-not-fit), or page the mid band. BandTable.rows is already data, so a band costs a Band value and a geometry, not a rule engine. PLANNED 2026-09-12 into FEAT-0018 as TASK-0072 (dealField places the remainder) and TASK-0075 (the renderer draws it), with the geometry derived in TASK-0073; decided in ADR-0005, option 1. The band is called the FAR band in the plan and the name is one of two open questions for Edwin."
    ISS-0078:
      file: "docs/issues/ISS-0078-The-Quiet-Band-Is-The-Only-Band-That-Insists-On-Drawing-Everything.md"
      title: "The quiet band is the only band that insists on drawing every note it holds, where the front and mid bands cap what they place and state the rest as a count, and drawing it buys nothing a person can use"
      status: open
      owner: user:edwin
      phase: PHASE-0002
      severity: medium
      component: renderer
      tests: []
      note: "Filed 2026-09-12 from Edwin: 'Do we really need the quite band???'. THE RECORD ALREADY PLANNED FOR THIS: PHASE-0002 carries a week-of-use exit criterion whose stated purpose is exactly this question, and it says a bad answer 'would retire the quiet band's placement, not the phase'. Deck already caps the front and mid bands and states the rest ('and N more in front, N more in the middle — all listed in the navigator'); the quiet band is the ONLY band that draws everyone. Of its three jobs, the count costs nothing and stays, push-behind (FEAT-0014) needs a PLACE and not a shelf and will hold a handful, and only 'the corpus has an inside' needs the tiles — the job that has never worked, since a tile cannot be clicked, tabbed to or read. RECOMMENDATION WITHDRAWN the same day. Two things read after it was written: DES-0002 promises the band 'stays ONE GESTURE AWAY', which argues for fixing the gesture rather than removing the band, and its rev 1 hit this exact defect ('quiet cards carried pointer-events: none... Fixed by making anything visible clickable'), so ISS-0073 is a REGRESSION against a decision already taken. ISS-0079 then found the field's real hole — hundreds of ACTIVE notes with no band at all — which is worse than finished notes in a band that is hard to reach. Once a fourth band gives those a place the quiet band is the far end of a gradient, not the odd one out. WHAT SURVIVES: the quiet band is the only band that draws every member, and 'place what fits, count the rest, say so' should apply to it too — a capacity, not a deletion. ANSWERED 2026-09-12: Edwin wrote 'on ISS-0078: do as suggested', so the quiet band gains a capacity and states its remainder like every other band. A CAPACITY, NEVER A DELETION -- the band stays drawn. Recorded in ADR-0005 as a rule over all four bands; built by TASK-0072 and TASK-0075. The withdrawn recommendation is not planned."
    ISS-0076:
      file: "docs/issues/ISS-0076-The-Quiet-Band-Is-Shaped-For-A-Corpus-Ten-Times-Most-Projects.md"
      title: "The quiet band's shape is a constant sized for the largest workspace on the fleet, so a project of three hundred notes puts its finished work on a shelf built for a thousand and pushes it further away than it needs to be"
      status: open
      owner: user:edwin
      phase: PHASE-0002
      severity: medium
      component: renderer
      tests: []
      note: "Filed 2026-09-12 from Edwin on ISS-0073: 'make the ring size adaptive based on the number of notes in a project'. QUIET is a frozen constant — 40 columns by 25 rows, 1000 a layer, depth 760 — and its only adaptivity runs one way: a bigger corpus steps BACK, a smaller one never comes forward. The measured spread is eight to one in visible tiles (Your Trainer 286 of 2,734 notes, cockpit 229 of 1,570, this repo 35 of 261). Suggestion: quietShapeFor(count) as a pure function driven by the DEAL's deep-band population, not the project's note count, since Issues and Phases differ by two orders of magnitude in one repo. Three things to settle: adapt by SIZE AND DETAIL with the band staying behind the person (depth is priority, and done work must not read as active), recompute on a view or workspace change only (a shape recomputed per deal never sits still), and note that this reframes ISS-0073 from yes-or-no into a threshold — 35 tiles as cards is 245 elements on 729 and free, 286 is 2,000 on 2,303 and doubles the document. CONFIRMED 2026-09-12 (adapt by size and detail, the band stays where it is) and PLANNED into FEAT-0018 as TASK-0073, covering all four bands rather than the quiet one alone. Its third next action is answered: ISS-0078 did not remove the shelf, so there is a shape to derive."
    ISS-0077:
      file: "docs/issues/ISS-0077-Glass-Draws-One-Element-Per-Note-And-Never-Uses-The-Pool.md"
      title: "Glass creates and destroys one DOM element per note and never uses the card pool Spread built to prove the approach, so the retrofit FEAT-0005 warned about is exactly what making finished notes clickable now costs"
      status: open
      owner: user:edwin
      phase: PHASE-0002
      severity: medium
      component: renderer
      tests: []
      note: "Filed 2026-09-12 from Edwin asking whether the pool was not the intended solution. HE REMEMBERED RIGHT. CardPool (renderer/cards.ts) opens with the reason — retrofitting means rewriting the renderer that assumed one element per note — and its ONLY caller is renderer.ts, Spread's desk; glass.ts has its own cardEls map and makeCard. NOT a slip: FEAT-0009 records 'The hybrid is kept. Nothing here asks for the pool DES-0002 proposed', which was true because the canvas did the pool's job past the mid band (front+mid is about 84 slots). ISS-0073 takes the canvas away and the reason expires. Two corrections to carry: a pool caps element CHURN and not the LIVE COUNT, so it makes a turn smooth without making a frame cheaper; and CardPool is POSITIONAL (pool[i] to cards[i]), which would break PHASE-0002's ticked exit criterion 2 ('11 of 12 cards kept their elements across a switch, none reused'). The shape to reach for is a FREE LIST behind Glass's existing note-to-element map, not CardPool itself. Owed only if ISS-0073 is answered by making finished notes cards; measure first. STILL CONDITIONAL 2026-09-12, and planned as TASK-0080 under FEAT-0018, NOT STARTED until TASK-0079's measurement says so. Both corrections survive into the task: churn not live count, and a free list behind Glass's cardEls map rather than the positional CardPool."
    ISS-0070:
      file: "docs/issues/ISS-0070-One-Note-Is-Drawn-Twice-While-Another-Is-In-The-Middle.md"
      title: "While a note stands in the middle, each of its neighbours is on screen twice — as a small ring note and as its own dimmed field card — and the opened note itself leaves a dashed frame in its slot, so one note is two things on the deck"
      status: open
      owner: user:edwin
      phase: PHASE-0002
      severity: high
      component: renderer
      tests: []
      note: "Filed 2026-09-12 from Edwin running Deck: 'there should only be one note on the deck'. Three decisions add up to the double image: the ring paints its own 168x44 .ring-card per neighbour (TASK-0069), redeal returns early while a note is in the middle so every field card stays at opacity 0.28 (FEAT-0017 decisions 9 and 10), and a lifted note leaves .field-card.ghost, a dashed outline DES-0002 and TASK-0035 both ask for. Two options: MOVE the cards onto the ring instead of copying them (recommended; costs ring capacity, roughly 6-8 places instead of 16) or keep the ring's own cards, grow them to card size and skip drawing what they stand for. Either way the ghost goes, which REVERSES a DES-0002 decision. DECIDED 2026-09-12, Edwin: 'move the cards, do not copy!' and 'Drop the filed-card ghost it doesn't work!'. DES-0002 is amended as part of the work. The capacity cost option 1 carried is GONE, because ISS-0071 and ISS-0072 moved the layout out of the visible window on the same day."
    ISS-0071:
      file: "docs/issues/ISS-0071-The-Note-In-The-Middle-Is-Not-The-Size-The-Person-Chose.md"
      title: "The note in the middle is sized by whatever leaves room for the ring rather than by the person, and it jumps to 320 by 240 the moment it is dragged, because focusLayout searches for a pane size and ignores the one the desk record holds"
      status: open
      owner: user:edwin
      phase: PHASE-0002
      severity: high
      component: renderer
      tests: []
      note: "Filed 2026-09-12 from Edwin running Deck: the opened note is the person's main note and its size is their decision; a move is not a resize. focusLayout takes no pane size at all — it searches down from FOCUS_MAX 640x480 to FOCUS_MIN 280x160 until ENOUGH (6) ring places fit — so TASK-0054's stored w/h is unread, and paintPane swaps between focusRect and paneRect (320x240 default) the instant a drag starts leaveFocus. Fix inverts the order of sacrifice: the pane size is an argument, the ring grows its curve and then drops places to '+N more'. DECIDED 2026-09-12, Edwin accepted the consequences and then changed the frame: 'there should always be space to the left and right of the note off-screen, so place the associated items there, do not use the current visible view as the constraint to layout the objects'. focusLayout stops refusing places outside the window. SETTLED 2026-09-12, Edwin: 'turning moves the note and the whole ring' — the pane is anchored to a BEARING on the cylinder and drawn FLAT at the person's size, no perspective. Three consequences are now task steps rather than questions: a flat pane needs a fade-and-stop rule at the 78-degree edge of sight, focusLayout returns angles and heights instead of pixels, and a drag on the pane becomes a turn plus a height change, which reuses the field's own arithmetic. The remembered reading size is still unanswered; recommend a store setting."
    ISS-0072:
      file: "docs/issues/ISS-0072-Moving-The-Note-In-The-Middle-Throws-The-Arrangement-Away.md"
      title: "Dragging the note in the middle ends the arrangement instead of carrying it: the ring is discarded, the whole field is dealt again and turns, so one small drag moves every card on screen"
      status: open
      owner: user:edwin
      phase: PHASE-0002
      severity: high
      component: renderer
      tests: []
      note: "Filed 2026-09-12 from Edwin running Deck: 'the associated notes should also move with it'. Not a code defect: FEAT-0017 decision 13 says a drag leaves the middle, and the header drag calls leaveFocus() on the first move, which clears the ring, re-deals the field and turns to face the neighbourhood — which is also why the ring notes reappear as ordinary cards wherever the deal puts them. REWRITING decision 13 is part of the fix. DECIDED 2026-09-12, Edwin: the drag carries the ring, and NEITHER option at the edge — 'Neighbours / notes in general can fall of the edge and move out of vision ... there should be a huge space to play with'. Nothing clamped, nothing folded, so a way BACK is now owed: an arrangement can be dragged out of sight entirely. SETTLED 2026-09-12 with ISS-0071: the arrangement lives on the cylinder, so a neighbour off the edge is reached by turning — which is what 'a huge space to play with' already means in Glass. The way back is cheaper than it looked: a note dragged out of sight is at a bearing, so the compass can name it and turn to it."
    ISS-0073:
      file: "docs/issues/ISS-0073-Nothing-In-The-Quiet-Band-Can-Be-Clicked.md"
      title: "A finished note cannot be opened from the Glass field at all: the quiet band is painted on a canvas that no pointer or keyboard handler reads, so the several hundred done notes are visible and unreachable"
      status: open
      owner: user:edwin
      phase: PHASE-0002
      severity: high
      component: renderer
      tests: []
      note: "Filed 2026-09-12 from Edwin running Deck: 'The completed issue notes you cannot select'. drawCards skips every deep-band slot so no element exists; paintCanvas draws them as 58x16 rectangles; the only canvas hit test, dotAt, is guarded by arrangement === 'orbit' at both callers, so the orbit got the hit test the field never did. No tab stop either. Four steps that stack: tileAt beside dotAt with the orbit's own click rule, a tile that grows under the pointer, zoom promoting a tile to a real card (settle with ISS-0074), and a roving tab stop for the shelf. 2026-09-12 Edwin asked a DIFFERENT question instead of choosing: what does it cost to make finished notes ordinary cards, and can the document hold only what is visible? His two follow-ups became ISS-0076 (adaptive band shape) and ISS-0077 (the pool Glass never used). Three quarters of the answer is already measured (PHASE-0002, 2026-09-10): 286 tiles visible at the worst moment against 2,303 elements, a card is about seven elements, so roughly 2,000 more — the document doubles. Headroom is thin: 2.2 ms of script per frame on a Mac Studio, 6.6 ms throttled 4x, laptop reading still owed. NEXT IS A MEASUREMENT, not a build. PLANNED 2026-09-12 into FEAT-0018 as TASK-0076 (tileAt, cursor, callout, one roving tab stop) and TASK-0077 (a tile large enough becomes a card, which keeps the promoted set small by construction). The measurement is TASK-0079, a step in the feature rather than a gate in front of it. The pull is FEAT-0014's and is not rebuilt."
    ISS-0074:
      file: "docs/issues/ISS-0074-Zoom-Makes-A-Card-Bigger-Without-Showing-More-Of-The-Note.md"
      title: "Zooming in makes a card and its type bigger and tells the person nothing new, because how much of a note is drawn is keyed to which band it stands in and never to how large it actually is on screen"
      status: open
      owner: user:edwin
      phase: PHASE-0002
      severity: medium
      component: renderer
      tests: []
      note: "Filed 2026-09-12 from Edwin running Deck: 'zooming should also bring in more of the note's content'. The field already has detail-by-distance, but it is keyed to dataset.band (the slot's band, a property of priority), which the zoom does not change; applyZoom only multiplies x, y and scale. Second half is a data problem: CardModel carries no body or excerpt, so a large card runs out of things to show after subtitle, status, progress and frontmatter. Steps: key the detail to apparent width (data-detail beside data-band), put the thresholds in a pure tested function, promote a quiet-band tile to a real card (shared seam with ISS-0073), and only then decide whether Deck's index should carry an excerpt — that last one is a payload change PHASE-0002's first exit criterion measures and owes a RISK note. 2026-09-12: Edwin asked what step 4 gives him. Answer: very little, and it is DROPPED. A project-os note is written point-first so its first paragraph nearly repeats the subtitle the card already carries; steps 1 to 3 have not run out of things to show (subtitle, status, progress, face properties are all hidden today); the full note is one click away in a pane at the size ISS-0071 gives the person; and it costs the 2.39 MB payload the phase's first exit criterion measures, plus a decision about what an excerpt means in a vault. Build 1 to 3, use them, ask again with an example if a zoomed card still reads thin. PLANNED 2026-09-12 into FEAT-0018: steps 1 and 2 as TASK-0074 (a pure detail.ts keyed to apparent width), step 3 as TASK-0077. Step 4 stays DROPPED. TASK-0074 also writes an amendment into FEAT-0016, whose scope put 'more detail at a larger scale' out of scope by name."
    ISS-0075:
      file: "docs/issues/ISS-0075-The-Smoke-Run-Takes-The-Keyboard-Away-Twenty-Three-Times.md"
      title: "The smoke run takes the keyboard away from whatever the person is doing more than twenty times, because every keyboard check calls app.focus with steal and there is no way to run the checks that do not need it on their own"
      status: open
      owner: user:edwin
      phase: PHASE-0002
      severity: medium
      component: tests
      tests: []
      note: "Filed 2026-09-12 from Edwin: 'can we change the testing so the deck is not constantly requesting focus?'. focusApp calls app.focus({ steal: true }) and is called 19 times in smoke-glass.ts, 4 in measure.ts, 1 in main.ts. pointer() and press() both use sendInputEvent, which needs no frontmost application, so most steps do not need focus at all; nothing separates the two kinds. Linux already escapes this — run-smoke.sh re-execs under xvfb-run — and macOS has no equivalent. Four steps: split the checks and default a hand-started run to the half that needs no focus, take focus once per suite instead of 23 times (measure first; the repeats were added for a reason nobody wrote down), print the mode before the first window opens, and spike offscreen rendering for everything except the frame measurement, which genuinely needs a visible focused window. DECIDED 2026-09-12, Edwin: 'default the run to no-focus'."
    ISS-0069:
      file: "docs/issues/ISS-0069-The-Verb-Buttons-Take-A-Full-Height-Column-Beside-The-Reader.md"
