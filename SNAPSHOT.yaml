      file: "docs/risks/RISK-0002-Decks-Read-Only-Guarantee-Rests-On-The-Sidecars-Own-Checks.md"
      title: "Deck's read-only guarantee rests on the sidecar's own path checks for anything carried in a query string, and Deck does not know when those change"
      status: closed
      owner: user:edwin
      phase: PHASE-0001
      note: "Risk scan at the PHASE-0001 close-out, 2026-09-07, from ISS-0014. Deck's allow-list matches the PATH; /api/render takes its target in the QUERY, so an allowed path carrying any target is forwarded verbatim from the LAN. What refuses it is the cockpit's _serve_render, in ANOTHER repository, and nothing in Deck watches it: not the tests, not ADR-0001, not the adoption table. Low likelihood (the guard is old and tested upstream), high impact (Deck's claim on this surface is 'reads only, second lock', on a host bound beyond loopback for a tablet). WORSE IN PHASE-0003: a vault is a personal corpus. Two shapes open, ISS-0014 does not pick: constrain the query, or accept one lock and WRITE THE DEPENDENCY DOWN in TST-0007, ADR-0001 and the adoption table."
    RISK-0001:
      file: "docs/risks/RISK-0001-A-Second-Sidecar-Takes-Over-Focus-Routing.md"
      title: "A second sidecar on the same repository takes over the cockpit's focus routing"
      status: closed
      owner: user:edwin
      phase: PHASE-0001
      note: "The sidecar writes .cockpit/url into the repository and the cockpit command follows it, so a second sidecar on one repository silently captures that routing -- and Deck and the cockpit are meant to be open together during this phase, because exit criterion 1 is a side-by-side comparison. Mitigated in TASK-0007 by reusing a running sidecar after verifying its identity, and starting one only when none answers."
    RISK-0003:
      file: "docs/risks/RISK-0003-Two-Evaluators-Of-The-Bases-Language.md"
      title: "Obsidian and Deck both evaluate the Bases language over the same base files, and the same file can show two different lists"
      status: closed
      owner: user:edwin
      phase: PHASE-0001
      note: "Risk scan for FEAT-0012, 2026-09-08. Deck seeds its description language from the Bases subset measured across ten live base files in ~/Notes, so Obsidian and Deck now evaluate the SAME FILE with two engines. Three ways they diverge: Deck does not implement a construct (most likely); Deck implements one differently (date arithmetic, string-versus-wikilink coercion, what an absent property compares equal to -- none of Obsidian's answers are written down anywhere Deck can read); or Obsidian changes, with no signal to Deck. Impact MEDIUM not high: nothing is written and no note is lost, but a view is how a person decides what to work on and a view quietly missing four notes is worse than a view that fails. MITIGATION, and it is the whole design: the seed is NAMED and the suite ENUMERATES it, and anything outside it is REPORTED BY NAME above the list, so a divergence looks like a message rather than a shorter list. Twelve real base files are fixtures. Trigger to watch: a count differing from Obsidian's with NO unsupported-construct report -- that means the evaluator was confidently wrong."
    RISK-0004:
      file: "docs/risks/RISK-0004-Decks-Index-Duplicates-The-Sidecars-Indexer.md"
      title: "Deck's index and the sidecar's index read the same notes and can disagree about them, so two applications show different counts of the same corpus"
      status: closed
      owner: user:edwin
      phase: PHASE-0001
      note: "Risk scan for FEAT-0011, 2026-09-08, from Edwin's decision that Deck keeps its own index. Same shape as RISK-0002: Deck depends on behaviour in ANOTHER REPOSITORY and nothing in Deck watches it. The visible failure is two applications disagreeing about a number in front of one person -- the cockpit says 34 issues need triage and Deck says 31 -- after which he trusts neither. Three drifts: a rule mirrored wrongly at the start (the type spelling is the obvious one), a sidecar change nobody notices, and a DELIBERATE difference nobody wrote down. The third is the trap: cockpit ISS-0279 drops a note whose type: is a list, Deck must not reproduce it, so Deck's count will be right and the equality test will fail for a GOOD reason -- and somebody will loosen the assertion instead of recording it. MITIGATION: mirror with a citation to the upstream rule; pin the RESULT (a fixture of the sidecar's own library groups, with its date and commit) rather than the implementation; record every deliberate difference as a NAMED ROW; keep Deck's index claiming only which notes a query selects, with obligations, render, context and writes left to the sidecar."
