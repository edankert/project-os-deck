      note: "Independent review, 2026-09-09. WORSE than ISS-0024 because it is SILENT: `scan()` strips blank and comment lines from the whole document before any reader runs, so a `|` block scalar loses every blank line, every line starting with `#`, and its trailing newline. Refutes TASK-0038's 'zero unreported problems'. Two latent siblings: `\\n` is read before `\\\\` so a literal backslash-n comes out as backslash-newline, and a nested block sequence flattens."
    ISS-0026:
