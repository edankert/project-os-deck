      order: 3
      owner: user:edwin
      features: []
      requirements: []
      tasks: []
      issues: []
      note: "Point Deck at ~/Notes and the vault's own structure appears: types detected from its templates and properties, its .base files as views, its .canvas files as read-only boards, its statuses banded. Reads everything, writes none of Obsidian's files. Depends on PHASE-0001 for the seam (the sidecar answering which views a workspace has) and NOT on PHASE-0002; third place is Edwin's stated order from 2026-09-06, not a technical constraint, so grooming can bring it forward. One blocker lives in the other repository: the cockpit's indexer drops a list-valued type:, which leaves 99 of the vault's 407 notes untyped, and that is project-os-cockpit ISS-0279 at triage. The cross-repo reference is kept in prose and related: only."
