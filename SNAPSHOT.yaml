    ISS-0030:
      file: "docs/issues/ISS-0030-A-Change-To-Any-File-Rebuilds-The-Index-And-Marks-Every-Window.md"
      title: "A change to any file at all rebuilds Deck's index and tells every window its notes changed, so saving an Obsidian layout raises the changed-under-you mark"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: low
      component: main
      tests: []
