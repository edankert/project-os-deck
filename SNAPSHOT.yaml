    FEAT-0003:
      file: "docs/features/store/FEAT-0003-One-Store-In-The-Main-Process.md"
      title: "One store in the main process: every window reads the same state and watches it change"
      status: doing
      owner: user:edwin
      phase: PHASE-0001
      requirements: []
      tasks: ["TASK-0010", "TASK-0011"]
      note: "State lives once, in the main process, and every window subscribes. This exists because of a measured cockpit failure: its renderer reads localStorage once at start and never listens for changes, so two cockpit windows never see each other change. The reducer is pure and tested without Electron; the transport is the thin half."
    FEAT-0004:
      file: "docs/features/windows/FEAT-0004-Windows-On-Any-Screen.md"
      title: "Windows on any screen: a panel pops out, remembers the display it was on, and never steals focus"
      status: doing
      owner: user:edwin
      phase: PHASE-0001
      requirements: []
      tasks: ["TASK-0012", "TASK-0013", "TASK-0014"]
      note: "Pop-out windows, bounds remembered per window and placed by display, one focus window that owns navigation and satellites that never steal it. The cockpit's window state is app-wide and carries no display identity, so a window saved on a monitor that is later unplugged restores off-screen; Deck's placement is a pure function of saved bounds and present displays, which is what makes the second exit criterion checkable without a second monitor."
    FEAT-0005:
      file: "docs/features/spread/FEAT-0005-Spread-Cards-On-A-Desk.md"
      title: "Spread: notes as cards on a desk, and a desk you can save and come back to"
      status: doing
      owner: user:edwin
      phase: PHASE-0001
      requirements: []
      tasks: ["TASK-0015", "TASK-0016"]
      note: "The phase's visible half: notes as cards, several at once, and a desk that saves an arrangement by name and reopens as it was left. Cards are drawn from a pool rather than one element per note, because adding pooling later means rewriting the renderer that assumed otherwise. A desk naming a note that is gone opens without it and says how many it dropped."
    FEAT-0006:
      file: "docs/features/addresses/FEAT-0006-Every-State-Has-An-Address.md"
      title: "Every reachable Deck state has an address, so a layout is a list of addresses and some geometry"
      status: doing
      owner: user:edwin
      phase: PHASE-0001
      requirements: []
      tasks: ["TASK-0017", "TASK-0018"]
      note: "One grammar covering workspace, view, desk and focused note, with a formatter and a strict parser. It is what makes a layout serialisable and a window restorable. The parser REFUSES what it cannot read rather than falling back to a default: the cockpit's silent fallback for an unknown nav mode made the Tests view look broken for thirty-three hours."
    FEAT-0007:
