    PHASE-0001:
      file: "docs/phases/PHASE-0001-Deck.md"
      title: "Deck — one store, windows on any screen, and Spread as the first view"
      status: planned
      order: 1
      owner: user:edwin
      features: []
      requirements: []
      tasks: []
      issues: []
      note: "The phase that makes Deck a thing you can open, and the one that carries the foundations rather than a separate foundations phase before it. Deliberate: a phase whose exit criterion is 'a window opens and shows a note' is not a milestone anyone can judge, and the two rules that must hold from the first line of code -- one renderer with two hosts, and views asked for from the sidecar rather than hard-coded -- would be stranded in a phase that ends before any view exists. Exit is measured, not listed: Spread opens the same notes as the cockpit, a status window survives a restart on a second display, and the same renderer served by the sidecar opens read-only on a tablet. If the phase proves too large to steer, the split point is the first criterion. Depends on work outside this repository: the sidecar gains a 'views for this workspace' answer, which is cheap now and expensive to retrofit."
