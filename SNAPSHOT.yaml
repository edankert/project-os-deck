      note: "Gated on measurement, not on taste. FEAT-0001 builds the read-only field over the real link graph and produces three numbers -- whether the whole edge list arrives in one request, whether the layout stays put when the corpus grows, and what frame rate the field holds on a laptop -- and DES-0002's arrangements are built only if those pass. Depends on PHASE-0001 for the store, the address grammar and the tablet host. TWO THINGS TO KNOW: the field is DECK-ONLY (Edwin 2026-09-06, the cockpit gets no orbit route; FEAT-0001 was rewritten that day from its cockpit-era text); and the measurements can fail, in which case the phase closes with the field alone and Spread is unaffected."
