    ISS-0027:
      file: "docs/issues/ISS-0027-Four-Evaluator-Paths-Select-The-Wrong-Notes.md"
      title: "Four paths in the evaluator select the wrong notes and report nothing, which is the failure the description feature says it exists to prevent"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: high
      component: shared
      tests: []
      note: "Independent review, 2026-09-09. FOUR paths produce a different answer confidently, which is the failure ADR-0004 says the feature exists to prevent. `contains` on a string tests equality not substring. `hasLink` ignores its receiver. `==` on strings is case-insensitive where Obsidian's is not. `file.path` is docs-root-relative so a base file's `inFolder(\"docs/__templates__\")` never matches — the cockpit's own NAVIGATION.base selects 14 notes here where the cockpit shows 13."
    ISS-0028:
      file: "docs/issues/ISS-0028-A-Test-Note-Names-A-Suite-That-Does-Not-Exist.md"
      title: "TST-0033's command and entrypoint name a suite file that was never created, so the repository's own test runner reports one failing test"
