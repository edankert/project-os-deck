template:
  replace_me: false

project:
  name: "project-os-deck"
  summary: "Deck: the second application over project-os notes and any Obsidian vault. Notes as cards arranged across windows and screens (Spread), and a spatial field where depth is priority (Glass). Shares project-os-cockpit's sidecar; the cockpit stays the primary place for new functionality, and Deck tracks its capability register so it can support what arrives."
  repo_root: "."

# Optional team model for multi-user/multi-agent projects. Descriptive only:
# project-os keeps no session/claim/heartbeat state — coordination is delegated
# to the tool's native orchestration (see tools/instructions/SNAPSHOT.md).
# team:
#   members:
#     - id: user:edwin
#       tool: claude-code
#       adapter: tools/adapters/claude-code
#     - id: user:alice
#       tool: codex
#       adapter: tools/adapters/codex

retention:
  derive_lists: true       # reverse lists follow each child's parent:/phase: (project-os-dev ADR-0048)
  policy: active-and-recent
  recent_changes_max: 25
  # Read by tools/scripts/sync-snapshot.py (ADR-0018). Absent = feature off.
  derive_fields: true      # title/goal derived from the note
  prune_window: 25         # keep N most recent terminal items per collection
  note: "Snapshot keeps active work + recent changes for handoff; notes are the archive. On 2026-09-11 FEAT-0015 (a desk for each view, notes kept on every view, Hide notes) was planned and built at Edwin's request; it is at review, waiting on its walk TST-0048 and his answer on whether a saved desk remembers its view. ISS-0068 (an intermittent cascade in the throw checks) is at triage. Later on 2026-09-11 FEAT-0016 (zoom) and FEAT-0017 (an opened note in the middle of its neighbours) were planned from REFERENCE-FOCUS-ZOOM-AND-VERBS, and ISS-0069 (the verb buttons' full-height column) was filed at triage for Edwin's choice. Later on 2026-09-11 FEAT-0016 (the wheel zooms Glass and the orbit) and FEAT-0017 (an opened note stands in the middle of its neighbours) were planned, built and tested at Edwin's request; both are at review, waiting on the walk TST-0052. ISS-0069 (where the approve and decline buttons go) waits on Edwin's choice. On 2026-09-12 Edwin ran Deck and filed six issues at triage from what he saw (ISS-0070 to ISS-0075); three of them revise decisions inside FEAT-0017, so its review is not finished. Later on 2026-09-12 FEAT-0018 was PLANNED from six of those issues after Edwin agreed the whole plan: a fourth band for active work the middle had no room for, a capacity and a stated remainder on every band including the quiet one, a derived geometry per band, a hit test and a keyboard route for the canvas, and detail keyed to apparent size. Nine tasks, three suites, one walk, ADR-0005 at proposed. Nothing is built."

