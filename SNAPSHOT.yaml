    ISS-0023:
      file: "docs/issues/ISS-0023-Two-Sidecars-For-One-Repository-When-The-Paths-Differ-Only-In-Case.md"
      title: "Deck starts a second sidecar for a repository the cockpit already has open when the two spell the home directory differently, and that sidecar rewrites the repository's discovery file to its own port"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: high
      component: main
      tests: []
      note: "Observed 2026-09-08 while starting Deck for the reopened TST-0011: the cockpit served your-trainer on 8766, Deck started its own on 8901 for the same directory, and .cockpit/url was rewritten to 8901 and left there dead when Deck went. Cause: alive() compares path.resolve(identity.root) with path.resolve(root) as STRINGS, and macOS is case-insensitive -- the cockpit launched with /Users/edwin/... and Deck holds /Users/Edwin/..., so the guard called one directory two. Reopens RISK-0001, whose mitigation is that comparison; both guarding checks pass because both spell their paths the same way. This repository is unaffected (both hold /Users/Edwin/Dev/repos/project-os-deck), which is why it went unseen. Two decisions: compare real paths rather than strings, and whether a stale discovery file naming a dead port belongs upstream in the cockpit."
    ISS-0022:
      file: "docs/issues/ISS-0022-The-Smoke-Run-Says-A-Popped-Out-Desk-Never-Draws-A-Card.md"
