  decisions:
    ADR-0001:
      file: "docs/decisions/ADR-0001-Deck-Serves-Its-Own-Read-Only-Host.md"
      title: "Deck serves its own renderer over HTTP and proxies the sidecar read-only"
      status: accepted
      owner: user:edwin
      note: "Deck runs its own HTTP host: it serves the renderer, proxies GET and HEAD to the sidecar and answers 405 to everything else, and the Electron window loads from it too. Forced by two facts plus one decision: the sidecar's static directory is fixed to its own package at import time, its one outside-directory flag serves a single allow-listed file (renderer.css) and 404s the rest, and Edwin ruled on 2026-09-06 that the cockpit is not changed for Deck. The by-product is the bigger win -- one origin for both hosts, so the shell and the tablet share one data path instead of two."
    ADR-0002:
      file: "docs/decisions/ADR-0002-Glass-Is-The-Main-View.md"
      title: "Glass is Deck's main view, built before parity with the cockpit; Spread stays a view beside it and the two share one desk"
      status: accepted
      owner: user:edwin
      note: "Edwin, 2026-09-07: 'I am still very much thinking that glass should be the main view, so let's build glass now first, iron out issues and then work on parity.' Option 2 of three (keep the order; Glass now as the main view; Glass only and retire Spread). Consequences: Deck opens in Glass and the address gains a surface with glass the default; views stay the provider's; ONE DESK shown by both surfaces; FEAT-0001's measurements become exit criteria of PHASE-0002 rather than a gate; a failed frame time returns Spread to default and is recorded; TST-0015 and PHASE-0001's seventh criterion move to the new PHASE-0004 Parity, which comes before Vault. Triggered by his ledger remark on TST-0015 that relationships and dependencies are what he cannot see in Deck."
    ADR-0003:
      file: "docs/decisions/ADR-0003-Deck-Writes-Through-The-Shell.md"
      title: "Deck writes through the shell to the loopback sidecar, and the host it serves a tablet never writes"
      status: accepted
      owner: user:edwin
      note: "Edwin, 2026-09-08, answering the architecture review: 'the tablet does not write', and earlier the same day 'The deck needs to have the same functionality as the cockpit, so it needs to be able to write'. Option 3 of three (stay read-only everywhere; forward writes once the cockpit's REQ-0034 defines a proof; the shell writes and the served host never does). The route is renderer -> preload bridge -> IPC -> LOOPBACK request to the sidecar's existing guarded endpoint; nothing about the sidecar changes. Deck's HTTP host still answers 405 to everything that is not a read, because forwarding a write would launder a tablet's address into loopback -- the hole ADR-0001 closed for the inbox reads. Capability gains write, false when served: a tablet sees NO VERB, absent not disabled. A RULE, not a wait: no condition names REQ-0034. Verbs come from GET /api/notes/actions (cockpit REQ-0026); the actor is a store setting. REVERSES PHASE-0001's 'Reads only' bullet and ARCHITECTURE.md's 'reads and never writes'; does NOT reverse ADR-0001. Adoption row api.write.notes: not applicable -> not yet."
    ADR-0004:
      file: "docs/decisions/ADR-0004-A-View-Is-A-Description.md"
      title: "A view is a description, evaluated over Deck's own index, in a language Deck owns and seeds from Obsidian Bases"
      status: accepted
      owner: user:edwin
      note: "Edwin, 2026-09-08: 'Decks own index, the Decks application are individual applications/views', and 'the issue with using the bases subset is that it is a subset which we know cannot represent everything, it might be possible to use it as an initial definition but we will need to be able to extend it probably significantly'. Option 4 of four for evaluation (mode source only; a cockpit records endpoint; the sidecar evaluates bases; Deck's own index -- chosen), plus a language of Deck's own rather than Obsidian's. Five sections: source, band, face, surfaces, verbs: registry. VERSION and EXTENSION NAMESPACE from version one; the three type spellings normalised; an unsupported construct REPORTED BY NAME, never an empty list. WITHDRAWS the review's proposal to file a records-endpoint issue in the cockpit. Consequences: RISK-0003 and RISK-0004; TASK-0029's table moves into the band section so the navigator, Spread and Glass read one rule; faces.ts becomes a reader; PHASE-0002 starts after the description feature; PHASE-0003 inherits a query language instead of inventing one. A VOCABULARY PAYLOAD is still owed by the cockpit and is filed there the day TASK-0044 starts."
  designs:
    DES-0001:
      file: "docs/designs/DES-0001-Nine-Ways-To-Read-The-Record.md"
      title: "Nine ways to read the record, and a tenth that was cut and then asked for — whole applications over one corpus"
      status: proposed
      owner: user:edwin
      note: "REV 2 re-pitched these as WHOLE APPLICATIONS after Edwin: the ask was a replacement for the cockpit, terminal included, not nine views. Carries a twelve-capability inventory read off the routes/endpoints/obligation registry and a coverage table; FOUR OF TEN cannot be a replacement and say so (PULSE no reader, DECK refuses navigation, BROADSHEET is print, ROOM cannot host a shell). Five keep the cockpit's reader and route to it. ORBIT and ROOM each carry a LIVE THREE-WAY TREATMENT TOGGLE, and both record a cost rather than a mood: glass collapses four of six status hues into 25 degrees, blocks cannot draw the 16148 edges. ORBIT is filed as FEAT-0001; ROOM was cut, challenged and promoted to plate 10. Originally: nine concepts drawn as working mocks in one artifact: ORBIT, ATLAS, REEL, PULSE, ASK, DECK, LEDGER, BROADSHEET, FOUNDRY. Each is separated from the others on six axes stated in the artifact's matrix, so the claim `these are different applications` is checkable rather than asserted. NOTHING IS ACCEPTED AND NOTHING IS SCHEDULED. Two of the nine collide with recorded decisions and the artifact says so on the plate rather than in a footnote: ASK is the conversation UI PHASE-028 itself puts out of scope, and DECK's one-card queue contradicts ADR-0020 (obligations live with their subject, not in a central queue). Mocks are driven by measured corpus figures, not invented ones — 1537 notes, 16148 wikilinks, 2206 distinct targets, and the month histogram 180/1/313/634 that makes the June silence visible."
    DES-0002:
      file: "docs/designs/DES-0002-The-Glass-Cockpit.md"
      title: "The glass cockpit — depth is priority, every view is a re-arrangement rather than a page, and the console is furniture that floats over the notes"
      status: proposed
      owner: user:edwin
      note: "REV 2 fixed the bug that made it untestable -- quiet cards carried pointer-events:none, so FEAT-0143 (done, therefore always quiet) could not be opened AT ALL; every visible card is now clickable and the search box flies to an id. Rev 2 also: per-type card faces with REAL phase progress bars (PHASE-041 21/23, PHASE-028 0/11, PHASE-999 0/27), phases leading their own sectors (rev 1 grouped by phase in four views and never rendered a phase), multiple console slabs, list panels beside the field, files, pulse lanes, the Orbit arrangement, multi-card open, and sector ordering so finished work stops occupying the visible columns. NEW SECTIONS: many monitors (only screen 1 gets a front plane -- two screens both claiming to show what needs you is how you end up trusting neither) and whether it would run (the visible arc holds ~40 cards of 1537, so POOLING IS THE ARCHITECTURE not an optimisation, and filter:blur must go). Originally: DES-0001's GLASS treatment taken seriously as a whole application, headset dropped on Edwin's instruction: desktop, mouse and keyboard, one window. THE MECHANIC IS THE FINDING -- nav_payload already prepends _needs_you_group to all eleven modes and appends suppressed_group to most, so every view is ALREADY three bands and a list can only express that by vertical position (which is why ADR-0025 had to be written). Depth carries it instead: front plane = owed, mid = the view's subject, deep field = the quiet 70%. A view switch is a re-arrangement, not a navigation, so you watch a note change importance. Console is furniture (drag, resize, translucent) and the layout treats it as an OBSTACLE that cards flow around. Consoles and agent sessions share one carousel; the twelve repos are the same mechanic at a different radius. Selecting a note brings its linked neighbours into a ring. Hue is left to say only what a note IS -- depth carries priority -- which is this design's answer to the four-hues-in-25-degrees cost DES-0001 recorded."

