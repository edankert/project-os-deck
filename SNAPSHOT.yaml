      tests: []
      note: "Re-review, 2026-09-09. ISS-0027 fixed hasLink ignoring its receiver and not the other half: file.hasLink reads only frontmatter and a record holds no body (a decision TASK-0038 records). The cockpit builds backlinks from frontmatter AND body, so Deck answers a smaller question in silence — and ISS-0027 says it "walks the whole record, which is what CONTEXT.base wants", which is wrong. Report it today; decide between reading body links at index time and asking /api/cockpit/context."
    ISS-0034:
      file: "docs/issues/ISS-0034-The-Sidecar-Comparison-Compares-No-Values.md"
      title: "The comparison against the sidecar reads key names and never values, so replacing every frontmatter value in all 2926 notes leaves it passing — and a file PyYAML refuses is exempt from it for ever"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: medium
      component: tests
      tests: []
      note: "Re-review, 2026-09-09. Replacing every frontmatter VALUE in all 2926 notes leaves both comparison checks passing: the check reads key NAMES. Third time in two days this one check has been found too narrow — types, then names — each time widened to the defect in front of it rather than to the claim it supports. The wider comparison HAS been made and passes (3333 notes, zero value differences); what is missing is the check that keeps it true. Also: a file PyYAML refuses is exempt for ever, so the eight REQ-019x notes are never compared, and REQ-0194 declares 16 keys where Deck reads 13."
    ISS-0035:
      file: "docs/issues/ISS-0035-Two-New-Block-Scalar-Misreads.md"
      title: "The fix that stopped a block scalar losing its blank lines introduced two new silent mis-reads: it swallows the lines after the scalar, and it ignores the indicator that says whether the last newline is kept"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: medium
      component: shared
      tests: []
      note: "Re-review, 2026-09-09. The ISS-0025 fix introduced TWO new silent mis-reads. blockScalar stops on the OWNER indent rather than the block\u2019s own, so `a: |` / 4-space x / 2-space `# c` reads "x\\n# c\\n" against PyYAML\u2019s "x\\n". And the chomping indicator is matched by the regexp that starts a block scalar and then ignored, so `|-` gains a trailing newline the old reader correctly omitted. Nothing in the three corpora exercises either: ~/Notes holds the only 17 block scalars and all are plain `|`, and the vault is not in the fixture."
    ISS-0036:
      file: "docs/issues/ISS-0036-Notes-Quote-Measurements-That-Do-Not-Reproduce.md"
      title: "Six numbers written into the close-out notes do not reproduce when the reader re-runs them, in a repository whose whole argument is that a measurement beats a claim"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: low
      component: docs
      tests: []
      note: "Re-review, 2026-09-09. Six numbers in the close-out notes do not reproduce: four mutation counts (ISS-0025 "three"=1, ISS-0026 "four"=1, ISS-0027 "one, two and four"=1,1,1, ISS-0030 "four"=1 — only ISS-0024\u2019s "two" is exact), "twenty-two notes"=14, and "143 notes carrying a status"=126. Each sits in a sentence arguing a measurement beats a claim, and a wrong measurement is worse than a claim because it invites a reader to stop checking. Also unrecorded: case-sensitivity silently empties every TaskNotes view over project-os (53 notes here to 0), and the premise "Obsidian\u2019s == is case-sensitive" carries no citation."
    ISS-0037:
      file: "docs/issues/ISS-0037-A-Decision-Made-In-Deck-Records-No-Reason.md"
      title: "A decision made in Deck moves the status and records no reason, because the field carrying the reason is dropped between the renderer and the sidecar"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: high
      component: main
      tests: []
      note: "Found 2026-09-09 by the round-trip check written for TST-0028, which drove Accept on ISS-0008 and expected the cockpit's decision callout. The sidecar writes the callout only when the request carries prose (_append_decision_record: if not text: return body). Deck's deck:write:transition handler builds the request from an allow-list of id/to/mtime/option, so note and severity never leave the shell, and applyVerb never collects prose in the first place. Decline in the cockpit records why; Decline in Deck records nothing, silently. Deck's own TransitionRequest already has both fields."
    ISS-0038:
      file: "docs/issues/ISS-0038-Nothing-Checks-The-Tag-That-Stops-A-Note-Running-Script.md"
      title: "One meta tag stops a note's own markup running script in the window that can write to the repository, and deleting it leaves every check green"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: high
      component: renderer
