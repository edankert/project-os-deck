    ISS-0002:
      file: "docs/issues/ISS-0002-A-Second-Deck-Cannot-Start-And-Says-Nothing.md"
      title: "A second Deck cannot start and says nothing — the free-port probe binds loopback while the host binds every interface, so a port another Deck already holds looks free, and the failure is an unhandled rejection with no window and no message"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: high
      component: main
      tests: ["TST-0001"]
      note: "FIXED 2026-09-06; two Decks now start side by side on 7300 and 7301. TWO faults, found 2026-09-06 while adding an npm script for the tablet walk. freePort probes by binding 127.0.0.1 and the host binds 0.0.0.0 under --lan, so a port another Deck holds on every interface reads as free and listen fails with EADDRINUSE. And app.whenReady().then(...) has no catch, so the failure skips window creation entirely: no window, no message, an application that appears to do nothing when launched. The second fault is what makes the first hard to diagnose."
    ISS-0001:
      file: "docs/issues/ISS-0001-Cards-From-The-Previous-View-Stay-On-Screen.md"
      title: "Cards from the previous view stay on screen — the pool hides a spare card with the `hidden` attribute, and the stylesheet's own `display: flex` overrides it, so switching to a shorter view repaints its cards over the top of the old ones"
      status: fixed
      owner: user:edwin
      phase: PHASE-0001
      severity: high
      component: renderer
      tests: ["TST-0014"]
      note: "FIXED 2026-09-06 with one stylesheet rule: [hidden] { display: none !important; }. Found by Edwin walking TST-0008, and his counts are the diagnosis: switching from Features (30 cards) to Tests (13) repaints 13 and leaves 17 of the old view on screen; Issues, Publication and Library have 0 and change nothing. CAUSE: the pool hides a spare card with element.hidden, and .card { display: flex } in Deck's own stylesheet beats the browser rule for hidden elements, so the mark is set and the card stays visible. NOTHING IN THE RENDERER IS WRONG -- the pool's arithmetic is right, only the paint is. No test caught it because none of the seven suites renders anything, and the smoke run counted `.card:not([hidden])`, which returns the right number while the wrong number is on screen."
